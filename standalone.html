<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#001405" />
    <title>ATC Simulator</title>
    <!--
      SELF-CONTAINED BUILD. This single file bundles index.html + css/style.css +
      every src/**/*.js module so the game plays directly from the local
      filesystem (file://), with no server and no network access. Regenerate with:
        node scripts/bundle.mjs
      Do not edit this file by hand; edit the source under src/ and rebuild.
    -->
    <style>
/* ATC Simulator - portrait-first, CRT radar aesthetic.
   Layout: full viewport flex column. Radar area flex 3 (~75%),
   console area flex 1 (~25%). Touch gestures are suppressed on the canvas. */

:root {
  --crt-green: #39ff14;
  --crt-green-dim: rgba(57, 255, 20, 0.5);
  --crt-bg: #001405;
  --console-bg: #04210b;
  --danger: #ff3b30;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  color: var(--crt-green);
  font-family: "Courier New", Courier, monospace;
  /* Prevent accidental text selection during touch drags. */
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  /* Honor device safe areas (notches, home indicator). */
  padding: env(safe-area-inset-top) env(safe-area-inset-right)
    env(safe-area-inset-bottom) env(safe-area-inset-left);
}

#game-root {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
}

#radar-canvas {
  flex: 3 1 0;
  width: 100%;
  min-height: 0;
  display: block;
  background: var(--crt-bg);
  /* Stop the browser from hijacking touch drags for scroll/zoom. */
  touch-action: none;
}

#console {
  flex: 1 1 0;
  min-height: 0;
  background: var(--console-bg);
  border-top: 2px solid var(--crt-green-dim);
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  overflow: hidden;
}

.console-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.console-field {
  font-size: clamp(14px, 4.5vw, 22px);
  letter-spacing: 1px;
  text-shadow: 0 0 6px var(--crt-green-dim);
}

.audio-control {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
}

.audio-mute {
  background: transparent;
  border: 1px solid var(--crt-green-dim);
  border-radius: 4px;
  color: var(--crt-green);
  font-size: 14px;
  line-height: 1;
  padding: 2px 6px;
  cursor: pointer;
}

.audio-mute.muted {
  color: #ff6a60;
  border-color: #ff6a60;
}

.audio-volume {
  width: 64px;
  accent-color: var(--crt-green);
}

.reputation-meter {
  flex: 1;
  height: 10px;
  border: 1px solid var(--crt-green-dim);
  border-radius: 5px;
  overflow: hidden;
}

.reputation-fill {
  height: 100%;
  width: 100%;
  background: var(--crt-green);
  box-shadow: 0 0 8px var(--crt-green-dim);
  transition: width 0.3s ease;
}

.flight-strips {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 4px;
  -webkit-overflow-scrolling: touch;
}

/* Individual flight strip: tappable row with callsign, class, altitude and a
   fuel bar. Left border is tinted with the aircraft class color. */
.flight-strip {
  border: 1px solid var(--crt-green-dim);
  border-left: 4px solid var(--crt-green);
  border-radius: 3px;
  padding: 3px 6px;
  background: rgba(57, 255, 20, 0.05);
  cursor: pointer;
  flex: 0 0 auto;
}

.flight-strip.selected {
  background: rgba(255, 255, 255, 0.12);
  border-color: #fff;
  box-shadow: 0 0 6px rgba(255, 255, 255, 0.5);
}

.flight-strip.fuel-low {
  border-left-color: #ffd23b;
}

.flight-strip.fuel-critical {
  border-left-color: var(--danger);
  animation: strip-blink 0.6s steps(2, start) infinite;
}

@keyframes strip-blink {
  to {
    background: rgba(255, 59, 48, 0.18);
  }
}

.strip-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: clamp(11px, 3.2vw, 14px);
}

.strip-callsign {
  font-weight: bold;
  letter-spacing: 1px;
}

.strip-kind {
  color: var(--crt-green-dim);
  font-size: 0.8em;
}

.strip-alt {
  margin-left: auto;
  color: rgba(220, 255, 210, 0.9);
  font-size: 0.85em;
}

.strip-fuel {
  margin-top: 3px;
  height: 4px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.12);
  overflow: hidden;
}

.strip-fuel-fill {
  height: 100%;
  width: 100%;
  background: var(--crt-green);
  transition: width 0.2s linear;
}

.flight-strip.fuel-low .strip-fuel-fill {
  background: #ffd23b;
}

.flight-strip.fuel-critical .strip-fuel-fill {
  background: var(--danger);
}

/* --- Screen overlays (menu / summary / shop / game over) ----------------- */

.screens {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(0, 10, 4, 0.92);
  z-index: 20;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.screens.visible {
  display: flex;
}

.screen-panel {
  width: 100%;
  max-width: 460px;
  margin: auto;
  background: var(--console-bg);
  border: 2px solid var(--crt-green-dim);
  border-radius: 8px;
  padding: 18px 16px;
  box-shadow: 0 0 24px rgba(57, 255, 20, 0.2);
}

.screen-title {
  font-size: clamp(18px, 6vw, 28px);
  letter-spacing: 2px;
  text-shadow: 0 0 8px var(--crt-green-dim);
  margin-bottom: 6px;
}

.screen-sub {
  color: rgba(220, 255, 210, 0.75);
  font-size: clamp(12px, 3.4vw, 15px);
  margin-bottom: 14px;
}

.map-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}

.map-card {
  display: flex;
  flex-direction: column;
  gap: 4px;
  text-align: left;
  padding: 12px;
  background: rgba(57, 255, 20, 0.06);
  border: 1px solid var(--crt-green-dim);
  border-radius: 6px;
  color: var(--crt-green);
  font-family: inherit;
  cursor: pointer;
}

.map-card:hover:not(.locked) {
  background: rgba(57, 255, 20, 0.14);
}

.map-card.locked {
  opacity: 0.4;
  cursor: not-allowed;
}

.map-name {
  font-weight: bold;
  letter-spacing: 1px;
  font-size: clamp(14px, 4vw, 18px);
}

.map-blurb {
  font-size: clamp(11px, 3vw, 13px);
  color: rgba(220, 255, 210, 0.7);
}

.stat-table {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 14px;
}

.stat-row {
  display: flex;
  justify-content: space-between;
  border-bottom: 1px dashed var(--crt-green-dim);
  padding: 3px 0;
  font-size: clamp(12px, 3.4vw, 15px);
}

.stat-value {
  color: rgba(220, 255, 210, 0.95);
  font-weight: bold;
}

.shop-balance {
  font-size: clamp(14px, 4.2vw, 18px);
  margin-bottom: 10px;
  text-shadow: 0 0 6px var(--crt-green-dim);
}

.shop-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 14px;
}

.shop-item {
  border: 1px solid var(--crt-green-dim);
  border-radius: 6px;
  padding: 8px 10px;
  background: rgba(57, 255, 20, 0.05);
}

.shop-item-head {
  display: flex;
  justify-content: space-between;
  font-size: 0.8em;
  color: var(--crt-green-dim);
}

.shop-label {
  font-weight: bold;
  letter-spacing: 1px;
  margin: 2px 0;
}

.shop-desc {
  font-size: 0.85em;
  color: rgba(220, 255, 210, 0.7);
  margin-bottom: 6px;
}

.screen-btn,
.shop-buy {
  font-family: inherit;
  color: #001405;
  background: var(--crt-green);
  border: none;
  border-radius: 5px;
  padding: 8px 14px;
  font-weight: bold;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow: 0 0 8px var(--crt-green-dim);
}

.screen-btn {
  width: 100%;
  margin-top: 6px;
  font-size: clamp(14px, 4vw, 17px);
  padding: 12px;
}

.shop-buy:disabled,
.screen-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  box-shadow: none;
}

    </style>
  </head>
  <body>
    <div id="game-root">
      <!-- Radar scope: top ~75% of the viewport. -->
      <canvas id="radar-canvas"></canvas>

      <!-- ATC console: bottom ~25%. Populated by later features. -->
      <section id="console" aria-label="ATC console">
        <div class="console-row">
          <span id="shift-clock" class="console-field">06:00</span>
          <span id="bank-balance" class="console-field">$0</span>
        </div>
        <div class="console-row">
          <div id="reputation-meter" class="reputation-meter">
            <div class="reputation-fill"></div>
          </div>
        </div>
        <div id="flight-strips" class="flight-strips" aria-label="Flight strips"></div>
      </section>

      <!-- Screen overlays (main menu / map select / summary / shop / game over).
           Populated and shown/hidden by src/ui/screens.js. -->
      <div id="screens" class="screens" aria-live="polite"></div>
    </div>
  
    <script>
      (function () {
        "use strict";
        // CommonJS-style module registry. Each factory runs once; its exports object
        // is cached. Isolated scopes => no cross-module identifier collisions.
        var __factories = {
        "src/core/vec2.js": function (exports, require) {
          // Pure 2D vector math. Operates on plain {x, y} objects and returns new objects
          // (except scalar-returning helpers). Zero DOM/canvas dependencies so this module
          // is fully unit-testable under Node.

          /** Create a vector. */
          function vec2(x = 0, y = 0) {
            return { x, y };
          }

          /** a + b */
          function add(a, b) {
            return { x: a.x + b.x, y: a.y + b.y };
          }

          /** a - b */
          function sub(a, b) {
            return { x: a.x - b.x, y: a.y - b.y };
          }

          /** a * s (scalar) */
          function scale(a, s) {
            return { x: a.x * s, y: a.y * s };
          }

          /** Euclidean length of a. */
          function length(a) {
            return Math.hypot(a.x, a.y);
          }

          /** Squared length (cheaper, avoids sqrt). */
          function lengthSq(a) {
            return a.x * a.x + a.y * a.y;
          }

          /** Unit vector in the direction of a. Returns {0,0} for the zero vector. */
          function normalize(a) {
            const len = Math.hypot(a.x, a.y);
            if (len === 0) return { x: 0, y: 0 };
            return { x: a.x / len, y: a.y / len };
          }

          /** Distance between a and b. */
          function distance(a, b) {
            return Math.hypot(a.x - b.x, a.y - b.y);
          }

          /** Squared distance between a and b. */
          function distanceSq(a, b) {
            const dx = a.x - b.x;
            const dy = a.y - b.y;
            return dx * dx + dy * dy;
          }

          /** Dot product. */
          function dot(a, b) {
            return a.x * b.x + a.y * b.y;
          }

          /** Angle of vector a in radians, measured from +x axis. */
          function angle(a) {
            return Math.atan2(a.y, a.x);
          }

          /** Angle in radians from a to b. */
          function angleBetween(a, b) {
            return Math.atan2(b.y - a.y, b.x - a.x);
          }

          /** Linear interpolation between a and b by t in [0,1]. */
          function lerp(a, b, t) {
            return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
          }

          /** Rotate vector a by angle (radians) around the origin. */
          function rotate(a, radians) {
            const cos = Math.cos(radians);
            const sin = Math.sin(radians);
            return { x: a.x * cos - a.y * sin, y: a.x * sin + a.y * cos };
          }

          /** Return a copy of the vector. */
          function clone(a) {
            return { x: a.x, y: a.y };
          }


          exports.vec2 = vec2;
          exports.add = add;
          exports.sub = sub;
          exports.scale = scale;
          exports.length = length;
          exports.lengthSq = lengthSq;
          exports.normalize = normalize;
          exports.distance = distance;
          exports.distanceSq = distanceSq;
          exports.dot = dot;
          exports.angle = angle;
          exports.angleBetween = angleBetween;
          exports.lerp = lerp;
          exports.rotate = rotate;
          exports.clone = clone;
        },
        "src/core/rng.js": function (exports, require) {
          // Seedable pseudo-random number generator (mulberry32). Deterministic for a
          // fixed seed so spawning and events are reproducible and testable. Pure module.

          /**
           * Create a deterministic RNG seeded by an integer.
           * @param {number} seed - 32-bit unsigned seed.
           */
          function createRng(seed = 1) {
            // Coerce to a 32-bit unsigned integer state.
            let state = seed >>> 0;

            /** Next float in [0, 1). */
            function next() {
              state |= 0;
              state = (state + 0x6d2b79f5) | 0;
              let t = Math.imul(state ^ (state >>> 15), 1 | state);
              t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
              return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            }

            /** Float in [min, max). */
            function range(min, max) {
              return min + next() * (max - min);
            }

            /** Integer in [min, max] inclusive. */
            function rangeInt(min, max) {
              return Math.floor(min + next() * (max - min + 1));
            }

            /** Pick a random element from a non-empty array. */
            function pick(array) {
              if (!array || array.length === 0) return undefined;
              return array[Math.floor(next() * array.length)];
            }

            /** Return true with probability p in [0, 1]. */
            function chance(p) {
              return next() < p;
            }

            return { next, range, rangeInt, pick, chance };
          }


          exports.createRng = createRng;
        },
        "src/core/spline.js": function (exports, require) {
          // Catmull-Rom spline utilities for the touch-drawn flight paths. Includes an
          // arc-length reparameterization so an aircraft can move at a constant speed
          // along the path regardless of control-point spacing. Pure module.

          /**
           * Sample a Catmull-Rom spline defined by `points` at parameter t in [0, 1].
           * The curve passes through every control point. Endpoints are duplicated so the
           * first and last segments are well defined.
           * @param {{x:number,y:number}[]} points
           * @param {number} t global parameter in [0,1]
           * @returns {{x:number,y:number}}
           */
          function sampleSpline(points, t) {
            const n = points.length;
            if (n === 0) return { x: 0, y: 0 };
            if (n === 1) return { x: points[0].x, y: points[0].y };
            if (n === 2) {
              // Straight line interpolation for two points.
              return {
                x: points[0].x + (points[1].x - points[0].x) * t,
                y: points[0].y + (points[1].y - points[0].y) * t,
              };
            }

            const clamped = Math.max(0, Math.min(1, t));
            const segments = n - 1;
            const scaled = clamped * segments;
            let i = Math.floor(scaled);
            if (i >= segments) i = segments - 1;
            const localT = scaled - i;

            const p0 = points[Math.max(0, i - 1)];
            const p1 = points[i];
            const p2 = points[i + 1];
            const p3 = points[Math.min(n - 1, i + 2)];

            return catmullRom(p0, p1, p2, p3, localT);
          }

          /** Catmull-Rom interpolation for a single segment (p1 -> p2). */
          function catmullRom(p0, p1, p2, p3, t) {
            const t2 = t * t;
            const t3 = t2 * t;
            return {
              x:
                0.5 *
                (2 * p1.x +
                  (-p0.x + p2.x) * t +
                  (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 +
                  (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
              y:
                0.5 *
                (2 * p1.y +
                  (-p0.y + p2.y) * t +
                  (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 +
                  (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3),
            };
          }

          /**
           * Build a dense polyline from control points together with cumulative arc
           * lengths, enabling constant-speed traversal. The polyline samples the smooth
           * Catmull-Rom curve.
           * @param {{x:number,y:number}[]} points control points
           * @param {number} samplesPerSegment resolution per segment
           * @returns {{points:{x:number,y:number}[], cumulative:number[], length:number}}
           */
          function buildPath(points, samplesPerSegment = 16) {
            if (!points || points.length === 0) {
              return { points: [], cumulative: [], length: 0 };
            }
            if (points.length === 1) {
              const p = { x: points[0].x, y: points[0].y };
              return { points: [p], cumulative: [0], length: 0 };
            }

            const segments = points.length - 1;
            const totalSamples = segments * samplesPerSegment;
            const poly = [];
            const cumulative = [];
            let accumulated = 0;

            for (let s = 0; s <= totalSamples; s++) {
              const t = s / totalSamples;
              const pt = sampleSpline(points, t);
              if (poly.length > 0) {
                const prev = poly[poly.length - 1];
                accumulated += Math.hypot(pt.x - prev.x, pt.y - prev.y);
              }
              poly.push(pt);
              cumulative.push(accumulated);
            }

            return { points: poly, cumulative, length: accumulated };
          }

          /**
           * Find the point along a built path at a given arc-length distance. Distances
           * are clamped to the path's [0, length] range.
           * @param {{points:{x:number,y:number}[], cumulative:number[], length:number}} path
           * @param {number} dist arc length from the start
           * @returns {{x:number,y:number}}
           */
          function pointAtDistance(path, dist) {
            const { points, cumulative, length } = path;
            if (!points || points.length === 0) return { x: 0, y: 0 };
            if (points.length === 1) return { x: points[0].x, y: points[0].y };

            const d = Math.max(0, Math.min(length, dist));

            // Binary search for the segment whose cumulative length brackets d.
            let lo = 0;
            let hi = cumulative.length - 1;
            while (lo < hi) {
              const mid = (lo + hi) >> 1;
              if (cumulative[mid] < d) lo = mid + 1;
              else hi = mid;
            }

            const i = Math.max(1, lo);
            const segStart = cumulative[i - 1];
            const segEnd = cumulative[i];
            const segLen = segEnd - segStart;
            const localT = segLen > 0 ? (d - segStart) / segLen : 0;

            const a = points[i - 1];
            const b = points[i];
            return {
              x: a.x + (b.x - a.x) * localT,
              y: a.y + (b.y - a.y) * localT,
            };
          }


          exports.sampleSpline = sampleSpline;
          exports.buildPath = buildPath;
          exports.pointAtDistance = pointAtDistance;
        },
        "src/core/spatialHash.js": function (exports, require) {
          // Uniform-grid spatial hash for broad-phase collision detection. Buckets entity
          // ids into fixed-size cells; queryNeighbors returns candidate ids within the
          // cells overlapping a query circle (broad phase: a precise distance test should
          // follow in the caller). Pure module, no DOM dependency.

          function createSpatialHash(cellSize = 64) {
            if (cellSize <= 0) throw new Error("cellSize must be positive");

            // Map<cellKey:string, number[] of ids>
            const cells = new Map();

            function keyFor(cx, cy) {
              return cx + "," + cy;
            }

            function cellCoord(v) {
              return Math.floor(v / cellSize);
            }

            /** Insert an entity id at world position (x, y). */
            function insert(id, x, y) {
              const key = keyFor(cellCoord(x), cellCoord(y));
              let bucket = cells.get(key);
              if (!bucket) {
                bucket = [];
                cells.set(key, bucket);
              }
              bucket.push(id);
            }

            /** Remove all entries. Call once per tick before re-inserting. */
            function clear() {
              cells.clear();
            }

            /**
             * Return candidate ids near (x, y) within `radius`. This is a broad-phase
             * query: it returns every id stored in any cell overlapping the query circle.
             * Candidates may lie slightly outside `radius`; callers do the exact test.
             */
            function queryNeighbors(x, y, radius) {
              const minCx = cellCoord(x - radius);
              const maxCx = cellCoord(x + radius);
              const minCy = cellCoord(y - radius);
              const maxCy = cellCoord(y + radius);

              const result = [];
              for (let cx = minCx; cx <= maxCx; cx++) {
                for (let cy = minCy; cy <= maxCy; cy++) {
                  const bucket = cells.get(keyFor(cx, cy));
                  if (bucket) {
                    for (let i = 0; i < bucket.length; i++) result.push(bucket[i]);
                  }
                }
              }
              return result;
            }

            return { insert, clear, queryNeighbors, cellSize };
          }


          exports.createSpatialHash = createSpatialHash;
        },
        "src/core/events.js": function (exports, require) {
          // Tiny synchronous pub/sub EventBus for decoupling systems. Example events:
          // 'aircraft:landed', 'aircraft:crashed', 'weather:windshift'. Pure module.

          function createEventBus() {
            // Map<eventName:string, Set<handler>>
            const listeners = new Map();

            /** Subscribe to an event. Returns an unsubscribe function. */
            function on(event, handler) {
              let set = listeners.get(event);
              if (!set) {
                set = new Set();
                listeners.set(event, set);
              }
              set.add(handler);
              return () => off(event, handler);
            }

            /** Unsubscribe a handler from an event. */
            function off(event, handler) {
              const set = listeners.get(event);
              if (set) {
                set.delete(handler);
                if (set.size === 0) listeners.delete(event);
              }
            }

            /** Emit an event synchronously to all current subscribers. */
            function emit(event, payload) {
              const set = listeners.get(event);
              if (!set) return;
              // Copy to tolerate handlers that subscribe/unsubscribe during dispatch.
              for (const handler of Array.from(set)) handler(payload);
            }

            /** Remove every listener (useful when tearing down a screen). */
            function clear() {
              listeners.clear();
            }

            return { on, off, emit, clear };
          }


          exports.createEventBus = createEventBus;
        },
        "src/ecs/components.js": function (exports, require) {

        "src/game/aircraft.js": function (exports, require) {

              maxTurnAngle: (150 * Math.PI) / 180, // can nearly reverse at a point
              hitboxRadius: 7,
              separationRadius: 46,

              hitboxRadius: 8,
              separationRadius: 42,
              wakeSeparation: 0,
              fuelMax: 110,
              runwayLengthRequired: 0, // uses the helipad, not a runway

              kind: AircraftKind.SUPERSONIC,
              name: "Supersonic",
              speed: 230,
              turnRateMax: (45 * Math.PI) / 180, // sluggish to turn at speed
              maxTurnAngle: (35 * Math.PI) / 180, // refuses sharp corners
              hitboxRadius: 9,
              separationRadius: 72,
              wakeSeparation: 0,
              fuelMax: 70, // minimal reserve

            ctx.moveTo(-s, s);

        "src/game/airport.js": function (exports, require) {
          // Airport geometry and the Map 1 ("Regional Airfield") definition. A runway has
          // a center, a heading (the landing direction, radians, pointing the way an
          // aircraft travels while rolling out), a length and width, and an approach cone
          // (angular tolerance + cone length) extending back from the touchdown threshold
          // against the landing direction. A helipad accepts any heading for helicopters.
          //
          // The alignment math is pure and exported so it can be unit-tested under Node.
          // Runways also carry a mutable occupancy state (a plane blocks the runway for a

          const { AircraftKind } = require("src/game/aircraft.js");

          const TWO_PI = Math.PI * 2;

          /** Normalize an angle to (-PI, PI]. */
          function normalizeAngle(a) {
            let x = a % TWO_PI;
            if (x <= -Math.PI) x += TWO_PI;
            if (x > Math.PI) x -= TWO_PI;

          function angleDifference(a, b) {
            return Math.abs(normalizeAngle(a - b));

          /**
           * Robustly derive the travel direction (radians) at the END of a drawn polyline.
           * A hand-drawn / touch path wobbles on its final segment, so taking atan2 of
           * only the last two points is noisy and can reject an otherwise-good approach.
           * Instead, walk back from the endpoint accumulating segments until we have
           * covered at least `tailLength` world-px (or run out of points), and return the
           * direction from that earlier anchor to the endpoint. This averages out the last
           * bit of jitter while still reflecting the final inbound course.
           *
           * Pure function. Falls back to the last-two-point heading for very short paths.
           * @param {Array<{x:number,y:number}>} points
           * @param {number} [tailLength] world-px of path tail to average over (default 32)
           * @returns {number} heading in radians (atan2 convention)
           */
          function approachHeadingFromPath(points, tailLength = 32) {
            if (!points || points.length < 2) return 0;
            const end = points[points.length - 1];
            // Walk backward until the straight-line distance from the anchor to the end
            // reaches tailLength, or we exhaust the path.
            let anchor = points[points.length - 2];
            for (let i = points.length - 2; i >= 0; i--) {
              anchor = points[i];
              if (Math.hypot(end.x - anchor.x, end.y - anchor.y) >= tailLength) break;
            }
            const dx = end.x - anchor.x;
            const dy = end.y - anchor.y;
            if (dx === 0 && dy === 0) {
              // Degenerate (anchor == end): fall back to the last distinct segment.

          function createMap1(width, height) {

            const cy = height / 2;

              id: "09/27",
              x: cx,
              y: cy,
              heading: 0, // landing toward +x (east)
              length: 230,
              width: 14,
              approach: { tolerance: (28 * Math.PI) / 180, coneLength: 200 },
              clearTime: 3,

            const runwayB = createRunway({
              id: "13/31",
              x: cx,
              y: cy,
              heading: (55 * Math.PI) / 180, // crosses runway A
              length: 180,
              width: 14,
              approach: { tolerance: (28 * Math.PI) / 180, coneLength: 180 },

              id: "H1",
              x: cx + 70,
              y: cy - 90,

            const hospital = {
              id: "HOSP",
              x: cx - width * 0.28,
              y: cy + height * 0.26,
              radius: 22, // a route passing within this radius "overflies" the hospital

            const holdFix = {

              x: cx + width * 0.3,
              y: cy + height * 0.28,
              radius: 34, // orbit radius

              name: "Regional Airfield",
              width,
              height,
              center: { x: cx, y: cy },
              runways: [runwayA, runwayB],

              // FEAT-005: all pads as a list (helipad stays the primary for back-compat).

          function routePassesHospital(hospital, points) {

          exports.AircraftKind = AircraftKind;

        "src/game/pathUtils.js": function (exports, require) {
          // Pure geometry helpers for flight-path validation and traversal, factored out
          // so the simulation math is unit-testable under Node without any DOM. Used by
          // the movement system and the input snap logic.

          const { buildPath, pointAtDistance } = require("src/core/spline.js");
          const { normalizeAngle } = require("src/game/airport.js");

          /**
           * The turn angle (radians, >= 0) at an interior control point: how sharply the
           * path bends when going from the incoming segment to the outgoing segment. A
           * straight line has turn angle 0; a full reversal approaches PI.
           */
          function turnAngleAt(prev, pt, next) {
            const inHeading = Math.atan2(pt.y - prev.y, pt.x - prev.x);
            const outHeading = Math.atan2(next.y - pt.y, next.x - pt.x);
            return Math.abs(normalizeAngle(outHeading - inHeading));
          }

          /**
           * Validate a list of control points against a class's maximum per-point turn
           * angle. Returns {ok, worstAngle, worstIndex}. Degenerate (zero-length)
           * segments are skipped. Pure function.
           * @param {{x:number,y:number}[]} points
           * @param {number} maxTurnAngle radians
           */
          function validateTurns(points, maxTurnAngle) {
            let worstAngle = 0;
            let worstIndex = -1;
            for (let i = 1; i < points.length - 1; i++) {
              const prev = points[i - 1];
              const pt = points[i];
              const next = points[i + 1];
              if (
                (prev.x === pt.x && prev.y === pt.y) ||
                (next.x === pt.x && next.y === pt.y)
              ) {
                continue;
              }
              const a = turnAngleAt(prev, pt, next);
              if (a > worstAngle) {
                worstAngle = a;
                worstIndex = i;
              }
            }
            return { ok: worstAngle <= maxTurnAngle, worstAngle, worstIndex };
          }

          /**
           * Clamp a raw list of drawn control points so no corner exceeds the class turn
           * limit. Points that would create an over-sharp corner are dropped. The first
           * and last points are always kept. Pure function. Returns a new array.
           */
          function clampTurns(points, maxTurnAngle) {
            if (points.length <= 2) return points.slice();
            const out = [points[0]];
            for (let i = 1; i < points.length - 1; i++) {
              const prev = out[out.length - 1];
              const pt = points[i];
              const next = points[i + 1];
              const a = turnAngleAt(prev, pt, next);
              if (a <= maxTurnAngle) out.push(pt);
              // else: skip this point, smoothing the corner.
            }
            out.push(points[points.length - 1]);

           * Heading is derived from a short look-ahead so the icon faces travel direction.
           * Pure function.
           * @param {object} built result of buildPath
           * @param {number} dist arc length from the start

            const ahead = pointAtDistance(built, Math.min(built.length, dist + 2));

            if (ahead.x === pos.x && ahead.y === pos.y) {
              const behind = pointAtDistance(built, Math.max(0, dist - 2));
              heading = Math.atan2(pos.y - behind.y, pos.x - behind.x);
            } else {
              heading = Math.atan2(ahead.y - pos.y, ahead.x - pos.x);
            }

          exports.turnAngleAt = turnAngleAt;
          exports.validateTurns = validateTurns;
          exports.clampTurns = clampTurns;
          exports.sampleAlong = sampleAlong;
        },
        "src/game/weather.js": function (exports, require) {
          // Weather: pure, DOM-free decision logic and geometry for the three weather
          // hazards (wind shifts, drifting thunderstorm cells, fog). Rendering of storms /
          // fog / the wind arrow lives in the HUD/render system; everything here is plain
          // math + state so it can be unit-tested under Node.
          //
          //   WIND SHIFT  - flips the active approach direction so a runway that used to
          //                 accept an approach from one end now accepts the opposite end.
          //                 landingSystem consults isApproachDirectionValid() to decide
          //                 whether a resolved landing direction is currently legal.
          //   THUNDERSTORM- opaque circular cells with a position, radius and drift
          //                 velocity. Each tick the cell drifts; a plane whose position
          //                 (or drawn route) intersects a cell is destroyed / loses nav.
          //   FOG         - a visibility factor (0..1). The render system fades aircraft
          //                 that are farther than the fog visibility range from the field,

          const { normalizeAngle, angleDifference } = require("src/game/airport.js");

          // --- Wind -----------------------------------------------------------------

          /**

           * must land into the wind, so the legal approach direction is the one pointing
           * OPPOSITE the wind's "blowing toward" heading, within a tolerance. A wind shift
           * rotates `windDirection` so the previously-correct end becomes invalid and the
           * opposite end becomes valid.

           * so a landing direction `landingHeading` is valid when it is roughly opposite
           * the wind direction. Pure function.

              y: opts.y ?? 0,

            windShiftMaxInterval: 70,
            stormMinInterval: 40, // seconds between storm spawns

           * reads the resulting state; emitting HUD banners is the system's job.

           * Pure in the sense that it touches no DOM; it does read wall-less sim time and

           * @param {object} opts { rng, map, config? }
           */
          function createWeatherController(opts = {}) {
            const rng = opts.rng;
            const map = opts.map;
            const cfg = { ...WEATHER_DEFAULTS, ...(opts.config || {}) };

            const state = {
              // Wind blows toward this heading. Default so runway A's primary direction
              // (heading 0, landing toward +x) is valid: wind blowing toward -x (west).
              windDirection: Math.PI,
              windTolerance: cfg.windTolerance,
              storms: [],
              fogIntensity: 0,
              _nextStormId: 1,
            };

            // Schedule timers (seconds of sim time until the next event of each type).
            let windTimer = randRange(cfg.windShiftMinInterval, cfg.windShiftMaxInterval);
            let stormTimer = randRange(cfg.stormMinInterval, cfg.stormMaxInterval);
            let fogTimer = randRange(cfg.fogMinInterval, cfg.fogMaxInterval);
            let fogActiveFor = 0; // remaining seconds of the current fog episode

            function randRange(a, b) {
              return rng ? rng.range(a, b) : (a + b) / 2;
            }

            /** Rotate the wind so the opposite approach becomes the valid one. */
            function shiftWind() {
              // Flip ~180 degrees with a little scatter so it reads as a real crosswind
              // reversal but stays within the new opposite window.
              const jitter = rng ? rng.range(-0.3, 0.3) : 0;
              state.windDirection = normalizeAngle(state.windDirection + Math.PI + jitter);
              return state.windDirection;
            }

            /** Spawn a storm cell drifting across the field from a random edge. */
            function spawnStorm() {
              const w = map ? map.width : 400;
              const h = map ? map.height : 600;
              const cx = map ? map.center.x : w / 2;
              const cy = map ? map.center.y : h / 2;
              // Start just off one edge and drift toward/across the field.
              const edge = rng ? rng.rangeInt(0, 3) : 0;
              const radius = randRange(cfg.stormRadius[0], cfg.stormRadius[1]);
              let x;
              let y;
              if (edge === 0) { x = -radius; y = randRange(0, h); }
              else if (edge === 1) { x = w + radius; y = randRange(0, h); }
              else if (edge === 2) { x = randRange(0, w); y = -radius; }
              else { x = randRange(0, w); y = h + radius; }
              // Drift roughly toward the field center with scatter.
              const toCenter = Math.atan2(cy - y, cx - x) + (rng ? rng.range(-0.5, 0.5) : 0);
              const speed = randRange(cfg.stormSpeed[0], cfg.stormSpeed[1]);
              const cell = createStormCell({
                id: state._nextStormId++,
                x,
                y,
                vx: Math.cos(toCenter) * speed,
                vy: Math.sin(toCenter) * speed,

                life: randRange(cfg.stormLife[0], cfg.stormLife[1]),

            /**
             * Advance weather by dt. Returns a list of event objects that occurred this
             * tick, e.g. [{type:'wind'}, {type:'storm', cell}, {type:'fog', on:true}].
             * The caller (weatherSystem) turns these into HUD banners / EventBus emits.
             */

              for (const cell of state.storms) driftStorm(cell, dt);
              state.storms = state.storms.filter((c) => {
                if (Number.isFinite(c.life) && c.life <= 0) return false;
                // Drop cells that have drifted well off the field.
                const cx = map ? map.center.x : 200;
                const cy = map ? map.center.y : 300;

              // Wind shift schedule.
              windTimer -= dt;
              if (windTimer <= 0) {
                windTimer = randRange(cfg.windShiftMinInterval, cfg.windShiftMaxInterval);

                events.push({ type: "wind", windDirection: state.windDirection });
              }

              // Storm spawn schedule (respect the cap).
              stormTimer -= dt;
              if (stormTimer <= 0) {
                stormTimer = randRange(cfg.stormMinInterval, cfg.stormMaxInterval);
                if (state.storms.length < cfg.maxStorms) {
                  const cell = spawnStorm();
                  events.push({ type: "storm", cell });
                }
              }

              // Fog schedule: toggle an episode on/off.
              if (fogActiveFor > 0) {
                fogActiveFor -= dt;
                // Ramp intensity up to 1 quickly, hold, then let it clear when the timer
                // runs out.
                state.fogIntensity = Math.min(1, state.fogIntensity + dt * 0.5);

                  state.fogIntensity = 0;
                  fogTimer = randRange(cfg.fogMinInterval, cfg.fogMaxInterval);
                  events.push({ type: "fog", on: false });
                }
              } else {
                fogTimer -= dt;
                if (fogTimer <= 0) {
                  fogActiveFor = randRange(cfg.fogDuration[0], cfg.fogDuration[1]);
                  state.fogIntensity = 0.05;
                  events.push({ type: "fog", on: true });
                }
              }

              return events;
            }

            return {
              state,
              update,
              // Expose the schedulers for tests / manual triggering.
              shiftWind,
              spawnStorm,
              get storms() {
                return state.storms;
              },
              get windDirection() {
                return state.windDirection;
              },
              get fogIntensity() {
                return state.fogIntensity;
              },
            };
          }


          exports.isApproachDirectionValid = isApproachDirectionValid;
          exports.createStormCell = createStormCell;
          exports.driftStorm = driftStorm;
          exports.isPointInStorm = isPointInStorm;
          exports.pointInAnyStorm = pointInAnyStorm;
          exports.pathCrossesStorm = pathCrossesStorm;
          exports.segmentIntersectsCircle = segmentIntersectsCircle;
          exports.fogVisibilityRange = fogVisibilityRange;
          exports.fogAlphaForDistance = fogAlphaForDistance;
          exports.WEATHER_DEFAULTS = WEATHER_DEFAULTS;
          exports.createWeatherController = createWeatherController;
        },
        "src/game/emergencies.js": function (exports, require) {
          // Emergencies: pure, DOM-free decision logic for the three emergency types.
          // Rendering (the red flash, the fuel gauge, the hospital POI marker) lives in
          // the HUD/render system; the gameplay rules that decide WHEN an emergency is
          // active, how it modulates a plane's behaviour, and whether a landing is
          // allowed are all here so they are unit-testable under Node.
          //
          //   MAYDAY / ENGINE FAILURE - a plane flagged as mayday moves faster (a speed
          //     multiplier), descends, red-flashes, and demands an immediate straight-line
          //     priority route to the nearest runway. maydaySpeedFactor() gives the speed
          //     bump; markMayday() stamps the emergency onto an Aircraft component.
          //   FUEL EMERGENCY - a plane held in a holding pattern too long burns down to a
          //     low-fuel state and crashes at empty. isFuelEmergency() tests the fuel
          //     fraction against the emergency threshold; the drain itself is fuel.js.
          //   MEDICAL EVAC - a helicopter that must overfly the hospital POI before its
          //     landing is accepted. isMedicalLandingAllowed() gates the landing on the
          //     hospital-visited flag.

          const { fuelStatus } = require("src/game/fuel.js");

          /** Canonical emergency type constants. */
          const EmergencyType = Object.freeze({
            MAYDAY: "mayday",
            FUEL: "fuel",
            MEDICAL: "medical",
          });

          /** Speed multiplier applied to a mayday (engine-failure) aircraft. */
          const MAYDAY_SPEED_FACTOR = 1.45;

          /** Fuel fraction at/under which a held plane is in a fuel emergency. */
          const FUEL_EMERGENCY_FRACTION = 0.25;

          /** Default probabilities / tuning for the emergency controller. */
          const EMERGENCY_DEFAULTS = Object.freeze({
            maydayChance: 0.08, // chance a given spawn becomes a mayday
            medicalChance: 0.5, // chance a helicopter spawn is a medical evac
            bonusReputation: 5, // reputation awarded for safely handling an emergency
          });

          /**
           * The effective speed factor for an aircraft given its emergency state. A
           * mayday plane flies faster; everyone else is unchanged. Pure function.
           * @param {object|null} emergency the Aircraft.emergency object (or null)
           * @param {number} [base] a base speed factor to multiply (default 1)
           */
          function maydaySpeedFactor(emergency, base = 1) {
            if (emergency && emergency.type === EmergencyType.MAYDAY) {
              return base * MAYDAY_SPEED_FACTOR;
            }
            return base;
          }

          /** Whether an aircraft is flagged as a mayday priority. Pure function. */
          function isMaydayPriority(emergency) {
            return !!(emergency && emergency.type === EmergencyType.MAYDAY);

          /**
           * Pick the nearest runway that is long enough to accept the given aircraft
           * class, measured from the aircraft's current position to each runway center.
           * A mayday gets an IMMEDIATE straight-line priority clearance to this runway
           * (see straightLineApproach below). Returns the runway object or null when no
           * runway on the map is adequate. Pure function (no DOM, no mutation).
           *
           * @param {Array} runways map.runways
           * @param {{x:number,y:number}} pos aircraft position
           * @param {object} aircraftDef class def (needs runwayLengthRequired)
           */
          function nearestAdequateRunway(runways, pos, aircraftDef) {
            if (!runways || runways.length === 0) return null;
            const need = aircraftDef ? aircraftDef.runwayLengthRequired ?? 0 : 0;
            let best = null;
            let bestDist = Infinity;
            for (const r of runways) {
              if (r.length < need) continue;
              const d = Math.hypot(pos.x - r.x, pos.y - r.y);
              if (d < bestDist) {
                bestDist = d;
                best = r;
              }
            }
            return best;
          }

          /**
           * Build a straight-line priority approach for a mayday: a two-point route from
           * the aircraft's current position to the chosen runway's threshold, with the
           * landing direction and far-end chosen to be the runway end that lets the plane
           * continue roughly forward (least heading change). Returns
           *   { points:[start, threshold], clearance:{surface, runwayId, heading, threshold, stop} }
           * so the landing system can commit it exactly like a hand-drawn clearance.
           * Pure function; `geom` injects the runway-geometry helpers so this module stays
           * free of an airport.js import cycle.

           * @param {{x:number,y:number}} pos aircraft position
           * @param {object} runway chosen runway
           * @param {object} geom { threshold(r), farEnd(r), normalizeAngle(a) }
           */
          function straightLineApproach(pos, runway, geom) {
            // Consider both landing directions; pick the one whose threshold is closest to
            // the aircraft so the straight-in is as short (and forward) as possible.
            const dirs = [runway.heading, geom.normalizeAngle(runway.heading + Math.PI)];
            let best = null;
            for (const heading of dirs) {
              const dirRunway = { ...runway, heading };
              const thr = geom.threshold(dirRunway);
              const far = geom.farEnd(dirRunway);
              const d = Math.hypot(pos.x - thr.x, pos.y - thr.y);
              if (!best || d < best.d) {
                best = { heading, thr, far, d };
              }
            }
            return {
              points: [
                { x: pos.x, y: pos.y },
                { x: best.thr.x, y: best.thr.y },
              ],
              clearance: {
                surface: "runway",
                runwayId: runway.id,
                heading: best.heading,
                threshold: { x: best.thr.x, y: best.thr.y },
                stop: { x: best.far.x, y: best.far.y },
                priority: true,
              },
            };
          }

           * Stamp a mayday/engine-failure emergency onto an Aircraft component. Marks it
           * priority and records the descent rate so the HUD can show a diving target.
           * Mutates and returns the aircraft. Pure (no DOM).
           */
          function markMayday(ac) {
            ac.emergency = {
              type: EmergencyType.MAYDAY,
              priority: true,
              speedFactor: MAYDAY_SPEED_FACTOR,
              descending: true,
              descentRate: 1, // relative: used by the HUD label only
            };
            // Keep the stamped factor on the emergency object only. The movement system
            // derives the effective speed from the emergency via maydaySpeedFactor(), so

            // drift or double-apply). ac.speedFactor stays at its base (1) for maydays.

          function markMedical(ac) {

              priority: false,
              hospitalVisited: false,

          function markFuelEmergency(ac) {
            ac.emergency = {
              type: EmergencyType.FUEL,
              priority: true,

           * Whether a plane's fuel has fallen into the emergency band. Pure function over
           * a Fuel component. Used to flag the visible gauge + reputation stakes.
           * @param {object} fuel Fuel component {capacity, remaining}
           * @param {number} [threshold] fraction (default FUEL_EMERGENCY_FRACTION)
           */
          function isFuelEmergency(fuel, threshold = FUEL_EMERGENCY_FRACTION) {
            if (!fuel) return false;
            const st = fuelStatus(fuel);
            return st.fraction <= threshold;
          }

          /**
           * Whether a medical-evac landing is currently allowed. The helicopter must have
           * overflown the hospital POI first (recorded on the emergency as
           * `hospitalVisited`). Non-medical aircraft are unaffected (always allowed).
           * Pure function.
           * @param {object|null} emergency the Aircraft.emergency object
           * @returns {boolean}
           */
          function isMedicalLandingAllowed(emergency) {
            if (!emergency || emergency.type !== EmergencyType.MEDICAL) return true;
            return emergency.hospitalVisited === true;
          }

        "src/game/economy.js": function (exports, require) {

          //

            [AircraftKind.COMMERCIAL]: 12,

          // linearly toward EFFICIENCY_MIN by EFFICIENCY_SLOW_TIME.
          const EFFICIENCY_MAX = 1.5;
          const EFFICIENCY_MIN = 0.8;

          const EFFICIENCY_SLOW_TIME = 120; // seconds

          /**
           * The efficiency multiplier for a given time in the airspace (seconds). Shorter
           * time => higher multiplier (bonus). Clamped to [EFFICIENCY_MIN, EFFICIENCY_MAX].
           * Pure function.
           */
          function efficiencyMultiplier(timeInAirspace) {
            const t = Math.max(0, timeInAirspace ?? 0);
            if (t <= EFFICIENCY_FULL_TIME) return EFFICIENCY_MAX;
            const span = EFFICIENCY_SLOW_TIME - EFFICIENCY_FULL_TIME;
            const over = Math.min(span, t - EFFICIENCY_FULL_TIME);
            const frac = over / span; // 0..1

           * Compute the revenue awarded for a landing. Pure function.
           * @param {object} info
           * @param {string} info.kind aircraft kind (AircraftKind.*)
           * @param {number} info.passengers passenger count
           * @param {number} info.timeInAirspace seconds the plane spent in the airspace
           * @param {number} [info.efficiencyBonus] optional explicit multiplier override;
           *   when provided it is used instead of the timeInAirspace-derived one.

            const per = PER_PASSENGER[kind] ?? 10;

            fuelOut: 25, // a plane ran out of fuel

            stormLoss: 20, // a plane flew into a thunderstorm cell and was lost

              penalize(type) {

          // time of day across a shift window (default 06:00 -> 14:00, an 8-hour shift

          // and isShiftOver() reports when the window is exhausted.

           * Create a shift clock.
           * @param {object} [opts]
           * @param {number} [opts.startMinutes] in-game start time, minutes past midnight
           *   (default 06:00 = 360).
           * @param {number} [opts.endMinutes] in-game end time, minutes past midnight
           *   (default 14:00 = 840).
           * @param {number} [opts.realSeconds] real seconds the shift lasts (default 480,
           *   i.e. 8 minutes of play for the 8-hour shift).
           */
          function createClock(opts = {}) {
            const startMinutes = opts.startMinutes ?? 6 * 60;
            const endMinutes = opts.endMinutes ?? 14 * 60;
            const realSeconds = opts.realSeconds ?? 480;
            const span = Math.max(1, endMinutes - startMinutes);

            return {
              startMinutes,
              endMinutes,
              realSeconds,
              elapsed: 0, // real seconds elapsed in the shift

              /** Advance the clock by real seconds. */
              tick(dt) {
                if (dt > 0) this.elapsed += dt;
                return this.elapsed;
              },

              /** Set the elapsed time directly (useful for syncing to sim time). */
              setElapsed(seconds) {
                this.elapsed = Math.max(0, seconds);
              },

              /** Current in-game time in minutes past midnight (does not pass the end). */
              currentMinutes() {
                const frac = Math.min(1, this.elapsed / this.realSeconds);
                return startMinutes + span * frac;
              },

              /** Fraction of the shift completed, 0..1. */
              progress() {
                return Math.min(1, this.elapsed / this.realSeconds);
              },

              /** The in-game time as "HH:MM" (24-hour). */
              format() {
                return formatMinutes(this.currentMinutes());

              /** True once the full shift window has elapsed. */
              isShiftOver() {
                return this.elapsed >= this.realSeconds;

          function formatMinutes(minutes) {
            let m = Math.floor(minutes);

        "src/game/progression.js": function (exports, require) {

        "src/ecs/world.js": function (exports, require) {
          // Entity-Component-System World. Entities are integer ids. Components are plain
          // data objects stored in a Map keyed by component name, each holding a
          // Map<entityId, data>. Systems (defined elsewhere) are plain functions that
          // query the world each tick. Pure module: no DOM/canvas dependency.

          function createWorld() {
            let nextId = 1;

            // Set of live entity ids.
            const entities = new Set();

            // Map<componentName:string, Map<entityId:number, data:object>>
            const components = new Map();

            /** Allocate a new entity id. */
            function createEntity() {
              const id = nextId++;
              entities.add(id);
              return id;
            }

            /** Destroy an entity and strip all of its components. */
            function destroyEntity(id) {
              if (!entities.has(id)) return;
              entities.delete(id);
              for (const store of components.values()) store.delete(id);
            }

            /** Whether an entity id is currently alive. */
            function hasEntity(id) {
              return entities.has(id);
            }

            /** Attach (or replace) a component of `name` on an entity. Returns the data. */
            function addComponent(id, name, data) {
              let store = components.get(name);
              if (!store) {
                store = new Map();
                components.set(name, store);
              }
              store.set(id, data);
              return data;
            }

            /** Get a component's data for an entity, or undefined. */
            function getComponent(id, name) {
              const store = components.get(name);
              return store ? store.get(id) : undefined;
            }

            /** Whether an entity has a component. */
            function hasComponent(id, name) {
              const store = components.get(name);
              return store ? store.has(id) : false;
            }

            /** Remove a component from an entity. */
            function removeComponent(id, name) {
              const store = components.get(name);
              if (store) store.delete(id);
            }

            /**
             * Query entity ids that possess all of the given component names.
             * @param {...string} names
             * @returns {number[]}
             */
            function query(...names) {
              if (names.length === 0) return Array.from(entities);

              // Start from the smallest component store to minimize iteration.
              let smallest = null;
              for (const name of names) {
                const store = components.get(name);
                if (!store) return []; // No entity can match a missing component.
                if (smallest === null || store.size < smallest.size) smallest = store;
              }

              const result = [];
              for (const id of smallest.keys()) {
                let matches = true;
                for (const name of names) {
                  if (!components.get(name).has(id)) {
                    matches = false;
                    break;
                  }
                }
                if (matches) result.push(id);
              }
              return result;
            }

            /** Number of live entities. */
            function entityCount() {
              return entities.size;
            }

            /** Remove every entity and component (used when loading a new map/shift). */
            function clear() {
              entities.clear();
              for (const store of components.values()) store.clear();
            }

            return {
              createEntity,
              destroyEntity,
              hasEntity,
              addComponent,
              getComponent,
              hasComponent,
              removeComponent,
              query,
              entityCount,
              clear,
            };
          }


          exports.createWorld = createWorld;
        },
        "src/ecs/systems/spawnSystem.js": function (exports, require) {
          // Spawn system. Emits a continuous stream of inbound aircraft from the radar
          // perimeter at a controlled, time-ramping rate using the seeded RNG so a shift
          // is reproducible. Each spawn gets a kind, a callsign, fuel, a heading aimed
          // roughly toward the field, and an initial short path so it drifts inbound until
          // the controller draws a route. Emits 'aircraft:spawn'.

          const { Components } = require("src/ecs/components.js");
          const { Transform, Velocity, Aircraft, Path, Hitbox, Render, Fuel, Label } = require("src/ecs/components.js");
          const { ALL_KINDS, getAircraftDef, AircraftKind } = require("src/game/aircraft.js");

          const CALLSIGN_PREFIX = {
            [AircraftKind.LIGHT]: "N",
            [AircraftKind.COMMERCIAL]: "AC",
            [AircraftKind.HELICOPTER]: "H",
            [AircraftKind.SUPERSONIC]: "SR",
          };

          /**
           * Compute the spawn interval (seconds) at a given elapsed shift time. Starts
           * relaxed and ramps up (shorter interval) as the shift progresses, floored so
           * the field never becomes impossible. Pure function.
           */
          function spawnInterval(shiftTime) {
            const base = 6.5; // seconds between spawns at the start
            const floor = 2.2; // never faster than this
            const ramp = Math.min(1, shiftTime / 300); // fully ramped after 5 minutes
            return base - (base - floor) * ramp;
          }

          /** Build the ECS spawn system bound to a game instance. */
          function createSpawnSystem(game) {
            const { world, bus, rng } = game;

            let timer = 0;
            let serial = 0;

            function makeCallsign(kind) {
              serial += 1;
              const prefix = CALLSIGN_PREFIX[kind] ?? "AC";
              const num = 100 + (serial % 900);
              return prefix + num;
            }

            function spawnOne() {
              const map = game.map;
              const kind = rng.pick(ALL_KINDS);
              const def = getAircraftDef(kind);

              // Spawn point on the perimeter circle around the field center.
              const angle = rng.range(0, Math.PI * 2);
              const r = map.spawnRadius;
              const x = map.center.x + Math.cos(angle) * r;
              const y = map.center.y + Math.sin(angle) * r;

              // Face roughly toward the field center with a little scatter.
              const toCenter = Math.atan2(map.center.y - y, map.center.x - x);
              const heading = toCenter + rng.range(-0.25, 0.25);

              const passengers = Math.round(
                rng.range(def.passengers[0], def.passengers[1])
              );

              const id = world.createEntity();
              world.addComponent(id, Components.Transform, Transform(x, y, heading));
              world.addComponent(id, Components.Velocity, Velocity(def.speed));
              world.addComponent(
                id,
                Components.Aircraft,
                Aircraft(kind, { passengers, state: "inbound" })
              );
              // Start with no drawn route; the plane drifts straight inbound.
              world.addComponent(id, Components.Path, Path([]));
              world.addComponent(id, Components.Hitbox, Hitbox(def.hitboxRadius));
              world.addComponent(
                id,
                Components.Render,
                Render({ shape: kind, color: def.color, size: def.hitboxRadius * 1.3 })
              );
              world.addComponent(id, Components.Fuel, Fuel(def.fuelMax));
              world.addComponent(id, Components.Label, Label(makeCallsign(kind)));

              // Track spawn time so landing can report time-in-airspace.
              const ac = world.getComponent(id, Components.Aircraft);
              ac.spawnTime = game.time;

              bus.emit("aircraft:spawn", { id, kind, passengers });
              return id;
            }

            const system = function spawnSystem(dt) {
              if (game.gameOver) return;
              timer += dt;
              // Map-specific spawn scaling (Map 4 Mega Hub is busier => shorter interval).
              const scale = (game.map && game.map.rules && game.map.rules.spawnScale) || 1;
              const interval = spawnInterval(game.time) * scale;
              if (timer >= interval) {
                timer -= interval;
                spawnOne();
              }
            };

            // Expose the one-shot spawner for tests / initial seeding.
            system.spawnOne = spawnOne;
            return system;
          }


          exports.spawnInterval = spawnInterval;
          exports.createSpawnSystem = createSpawnSystem;
        },
        "src/ecs/systems/weatherSystem.js": function (exports, require) {

          //   - storms: any aircraft whose position sits inside a cell, or whose locked
          //     route crosses a cell, loses navigation (its path is cleared) and, if it is
          //     actually inside the cell, is destroyed. A destroyed plane penalizes

              game.weather.storms = controller.state.storms;

        },

              ctx.arc(t.x, t.y, r, 0, Math.PI * 2);
              ctx.stroke();

          }

            ctx.fillStyle = "#ffd23b";
