              drawAircraft(ctx, world, game, blinkPhase);
              drawEmergencyFlash(ctx, world, blinkOn);
              drawLowFuelGauges(ctx, world, blinkOn);
              // Fog bank(s): a drifting region that conceals only the area it covers.
              // Drawn in WORLD space (banks carry world coords) over the aircraft so the
              // blocked part of the scope reads as clouded over. Concealment of individual
              // blips happens inside drawAircraft (fogConceals + '?' glyph).
              if (game.weather) drawFog(ctx, game.weather.fog);
              ctx.restore();

              // Screen-space overlays.
              if (game.weather) drawWindIndicator(ctx, game.weather);
              drawProximityAlarm(ctx, width, height, game.closestSeparation, ALARM_THRESHOLD, blinkOn);
              if (game.banner && game.banner.text) {
                drawEventBanner(ctx, width, game.banner.text, game.banner.alpha ?? 1);
              }

              if (game.gameOver) drawGameOver(ctx, width, height, game.gameOverReason);
            };
          }

          /** CRT radar field with grid, range rings and rotating sweep. */
          function drawRadarBackground(ctx, width, height, sweepAngle) {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = "#001405";
            ctx.fillRect(0, 0, width, height);

            const cx = width / 2;
            const cy = height / 2;
            const maxR = Math.hypot(width, height) / 2;

            ctx.strokeStyle = "rgba(57, 255, 20, 0.10)";
            ctx.lineWidth = 1;
            const spacing = 40;
            ctx.beginPath();
            for (let x = cx % spacing; x <= width; x += spacing) {
              ctx.moveTo(x, 0);
              ctx.lineTo(x, height);
            }
            for (let y = cy % spacing; y <= height; y += spacing) {
              ctx.moveTo(0, y);
              ctx.lineTo(width, y);
            }
            ctx.stroke();

            ctx.strokeStyle = "rgba(57, 255, 20, 0.22)";
            for (let r = spacing; r <= maxR; r += spacing * 2) {
              ctx.beginPath();
              ctx.arc(cx, cy, r, 0, Math.PI * 2);
              ctx.stroke();
            }

            const grad = ctx.createLinearGradient(
              cx,
              cy,
              cx + Math.cos(sweepAngle) * maxR,
              cy + Math.sin(sweepAngle) * maxR
            );
            grad.addColorStop(0, "rgba(57, 255, 20, 0.5)");
            grad.addColorStop(1, "rgba(57, 255, 20, 0)");
            ctx.strokeStyle = grad;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(sweepAngle) * maxR, cy + Math.sin(sweepAngle) * maxR);
            ctx.stroke();
          }

          /**
           * Collect the set of runway ids that currently have an aircraft cleared onto
           * them (locked clearance or rolling out), so the render layer can highlight the
           * active runway + its catch cone. Display-only; never touches the sim.
           */
          function activeRunwayIds(world) {
            const active = new Set();
            const ids = world.query(Components.Aircraft);
            for (const id of ids) {
              const ac = world.getComponent(id, Components.Aircraft);
              const rid = ac && ac.clearance && ac.clearance.runwayId;
              if (rid != null) active.add(rid);
              const lrid = ac && ac.landing && ac.landing.runwayId;
              if (lrid != null) active.add(lrid);
            }
            return active;
          }

          /**
           * The landing assignment of the currently-selected aircraft, so the render layer
           * can emphasize the runway/pad the player is being asked to land it on when they
           * select (communicate with) it. Returns the Aircraft.assignment or null.
           */
          function selectedAssignment(world, selectedId) {
            if (selectedId == null || !world.hasEntity || !world.hasEntity(selectedId)) return null;
            const ac = world.getComponent(selectedId, Components.Aircraft);
            return ac && ac.assignment ? ac.assignment : null;
          }

          /**
           * Draw runways, their approach cones, and the helipad. `now` is the current sim
           * time: a runway with `now < occupiedUntil` has just taken a landing and is
           * rendered RED ("occupied / clearing") until the ground crew clears it, when it
           * returns to its normal/green styling.
           *
           * `highlight` is the selected aircraft's assignment (FEAT-004 select=communicate):
           * when set, the runway/pad the plane must land on gets an extra bright emphasis
           * so the player can see where to route it. `blinkOn` pulses that emphasis.
           */
          function drawAirport(ctx, map, activeIds, now = 0, weather = null, highlight = null, blinkOn = true) {
            if (!map) return;
            const active = activeIds || new Set();

            // FEAT-003: which landing DIRECTION(s) are into the wind (and therefore
            // routable) right now. At steady state exactly one end per runway; during a
            // wind-shift transition both ends. Emphasize the active threshold/cone and
            // dim the inactive end so the player can see which way to land.
            const windState =
              weather && weather.windDirection != null
                ? {
                    windDirection: weather.windDirection,
                    windTolerance: weather.windTolerance,
                    transition: weather.windTransition,
                  }
                : null;
            const dirIsActive = (runway, heading) => {
              if (!windState) return true; // no weather => both ends drawn equally
              const legal = activeLandingDirections(runway, windState);
              return legal.some((d) => Math.abs(normalizeAngle(d - heading)) < 1e-3);
            };

            for (const runway of map.runways) {
              // Both landing directions share one physical strip; draw cones for each.
              // The runway with a cleared aircraft gets a brighter "catch zone" cone so
              // the active approach reads at a glance. A cone whose landing direction is
              // not currently into the wind is dimmed (inactive end).
              const cleared = active.has(runway.id);
              const nearActive = dirIsActive(runway, runway.heading);
              const farActive = dirIsActive(runway, runway.heading + Math.PI);
              drawApproachCone(ctx, runway, runway.heading, cleared || nearActive, !nearActive);
              drawApproachCone(ctx, runway, runway.heading + Math.PI, cleared || farActive, !farActive);
            }

            for (const runway of map.runways) {
              const thr = runwayThreshold(runway);
              const far = runwayFarEnd(runway);
              const isActive = active.has(runway.id);
              // Occupied: a landing is clearing the strip (now < occupiedUntil). The red
              // "in use" styling takes visual priority over the active-amber underglow
              // once a plane has touched down.
              const occupied = now < (runway.occupiedUntil || 0);

              // An active (cleared) runway gets a faint amber underglow so it reads as the
              // one in use, consistent with the amber cleared-path/lock cues. An occupied
              // runway gets a RED underglow instead so "used, clearing" reads at a glance.
              if (occupied) {
                ctx.strokeStyle = "rgba(255, 59, 48, 0.35)";
                ctx.lineWidth = runway.width + 7;
                ctx.lineCap = "round";
                ctx.beginPath();
                ctx.moveTo(thr.x, thr.y);
                ctx.lineTo(far.x, far.y);
                ctx.stroke();
                ctx.lineCap = "butt";
              } else if (isActive) {
                ctx.strokeStyle = "rgba(255, 190, 40, 0.30)";
                ctx.lineWidth = runway.width + 7;
                ctx.lineCap = "round";
                ctx.beginPath();
                ctx.moveTo(thr.x, thr.y);
                ctx.lineTo(far.x, far.y);
                ctx.stroke();
                ctx.lineCap = "butt";
              }

              ctx.strokeStyle = occupied
                ? "rgba(255, 90, 80, 0.95)"
                : isActive
                ? "rgba(235, 240, 255, 0.95)"
                : "rgba(200, 220, 255, 0.85)";
              ctx.lineWidth = runway.width;
              ctx.lineCap = "butt";
              ctx.beginPath();
              ctx.moveTo(thr.x, thr.y);
              ctx.lineTo(far.x, far.y);
              ctx.stroke();

              // Threshold bar: a bright crossbar marking the touchdown end so the "aim
              // here" end of the active strip is obvious. RED while occupied.
              const perp = runway.heading + Math.PI / 2;
              const hw = runway.width / 2;
              ctx.strokeStyle = occupied
                ? "rgba(255, 59, 48, 0.95)"
                : isActive
                ? "rgba(255, 214, 70, 0.95)"
                : "rgba(220, 235, 255, 0.8)";
              ctx.lineWidth = 2.5;
              ctx.beginPath();
              ctx.moveTo(thr.x - Math.cos(perp) * hw, thr.y - Math.sin(perp) * hw);
              ctx.lineTo(thr.x + Math.cos(perp) * hw, thr.y + Math.sin(perp) * hw);
              ctx.stroke();

              // FEAT-003: label the ACTIVE (into-wind) landing end(s) with the runway end
              // name so the player can see which direction to land on. During a transition
              // both ends are active and both get labels. The label sits just outside the
              // threshold, back along the approach (where inbound traffic sees it).
              const nearActive = dirIsActive(runway, runway.heading);
              const farActive = dirIsActive(runway, runway.heading + Math.PI);
              ctx.save();
              ctx.font = 'bold 8px "Courier New", monospace';
              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              ctx.fillStyle = "rgba(255, 214, 70, 0.95)";
              const labelOffset = runway.width + 10;
              if (nearActive) {
                const lx = thr.x - Math.cos(runway.heading) * labelOffset;
                const ly = thr.y - Math.sin(runway.heading) * labelOffset;
                ctx.fillText(runwayEndLabel(runway, runway.heading), lx, ly);
              }
              if (farActive) {
                const fdir = normalizeAngle(runway.heading + Math.PI);
                const fx = far.x - Math.cos(fdir) * labelOffset;
                const fy = far.y - Math.sin(fdir) * labelOffset;
                ctx.fillText(runwayEndLabel(runway, fdir), fx, fy);
              }
              ctx.textAlign = "left";
              ctx.textBaseline = "alphabetic";
              ctx.restore();

              // Edge lights: a row at each end. Red when occupied, green when clear — the
              // literal "runway lights turn red" cue.
              const lightColor = occupied ? "rgba(255, 59, 48, 0.95)" : "rgba(57, 255, 20, 0.9)";
              ctx.fillStyle = lightColor;
              for (const end of [thr, far]) {
                for (const s of [-1, 1]) {
                  ctx.beginPath();
                  ctx.arc(
                    end.x + Math.cos(perp) * hw * s,
                    end.y + Math.sin(perp) * hw * s,
                    1.6,
                    0,
                    Math.PI * 2
                  );
                  ctx.fill();
                }
              }

              // Centerline dashes.
              ctx.strokeStyle = occupied ? "rgba(255, 120, 110, 0.6)" : "rgba(255,255,255,0.55)";
              ctx.lineWidth = 1.5;
              ctx.setLineDash([6, 8]);
              ctx.beginPath();
              ctx.moveTo(thr.x, thr.y);
              ctx.lineTo(far.x, far.y);
              ctx.stroke();
              ctx.setLineDash([]);
            }

            // Helipad: circle with an "H".
            const pad = map.helipad;
            if (pad) {
              ctx.strokeStyle = "rgba(120, 200, 255, 0.9)";
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.arc(pad.x, pad.y, pad.radius, 0, Math.PI * 2);
              ctx.stroke();
              ctx.fillStyle = "rgba(120, 200, 255, 0.9)";
              ctx.font = `${Math.round(pad.radius)}px "Courier New", monospace`;
              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              ctx.fillText("H", pad.x, pad.y + 1);
              ctx.textAlign = "left";
              ctx.textBaseline = "alphabetic";
            }

            // FEAT-004: emphasize the surface the SELECTED plane is assigned to, so
            // "communicating" with a plane shows where it needs to land. For a specific
            // runway/pad draw a bright pulsing marker; for 'any' mode we deliberately draw
            // NOTHING extra (the plane has no preference, so no single surface to point
            // at) — the simpler, less-cluttered readable option.
            if (highlight) drawAssignmentHighlight(ctx, map, highlight, blinkOn);
          }

          /**
           * Draw an extra emphasis marker on the runway/pad named by a selected plane's
           * assignment. A specific runway gets a bright pulsing centerline glow + end ring;
           * a specific pad gets a pulsing ring. 'any' mode highlights nothing (no single
           * surface to point at). Display-only.
           */
          function drawAssignmentHighlight(ctx, map, assignment, blinkOn) {
            const col = blinkOn ? "rgba(120, 230, 255, 0.95)" : "rgba(120, 230, 255, 0.4)";
            if (assignment.kind === "runway" && assignment.runwayId != null) {
              const runway = map.runways && map.runways.find((r) => r.id === assignment.runwayId);
              if (!runway) return;
              const thr = runwayThreshold(runway);
              const far = runwayFarEnd(runway);
              ctx.save();
              ctx.strokeStyle = col;
              ctx.lineWidth = 3;
              ctx.setLineDash([]);
              ctx.beginPath();
              ctx.moveTo(thr.x, thr.y);
              ctx.lineTo(far.x, far.y);
              ctx.stroke();
              // End rings so the assigned strip pops.
              for (const end of [thr, far]) {
                ctx.beginPath();
                ctx.arc(end.x, end.y, runway.width * 0.9 + 4, 0, Math.PI * 2);
                ctx.stroke();
              }
              ctx.restore();
              return;
            }
            if (assignment.kind === "helipad") {
              const pads = map.helipads && map.helipads.length ? map.helipads : map.helipad ? [map.helipad] : [];
              const pad = assignment.padId != null ? pads.find((p) => p.id === assignment.padId) : map.helipad;
              if (!pad) return;
              ctx.save();
              ctx.strokeStyle = col;
              ctx.lineWidth = 3;
              ctx.beginPath();
              ctx.arc(pad.x, pad.y, pad.radius + 5, 0, Math.PI * 2);
              ctx.stroke();
              ctx.restore();
            }
          }

          /**
           * Draw a single approach cone extending back from a runway threshold. The cone
           * is the forgiving "catch zone": end a drawn route anywhere inside it tracking
           * the runway heading and the approach snaps and locks. An `active` cone (a
           * plane already cleared into this runway) is drawn brighter.
           */
          function drawApproachCone(ctx, runway, direction, active = false, dim = false) {
            ctx.save();
            if (dim) ctx.globalAlpha = 0.28; // inactive (down-wind) end reads faint
            const thr = {
              x: runway.x - Math.cos(direction) * (runway.length / 2),
              y: runway.y - Math.sin(direction) * (runway.length / 2),
            };
            const tol = runway.approach.tolerance;
            const len = runway.approach.coneLength;
            const back = direction + Math.PI; // cone opens toward inbound traffic
            const a1 = back + tol;
            const a2 = back - tol;

            const ex1 = thr.x + Math.cos(a1) * len;
            const ey1 = thr.y + Math.sin(a1) * len;
            const ex2 = thr.x + Math.cos(a2) * len;
            const ey2 = thr.y + Math.sin(a2) * len;

            // Filled wedge. A gradient fades the catch zone out toward its wide end so the
            // mouth reads as "aim roughly here" without a hard edge.
            const grad = ctx.createLinearGradient(thr.x, thr.y, (ex1 + ex2) / 2, (ey1 + ey2) / 2);
            if (active) {
              grad.addColorStop(0, "rgba(255, 210, 70, 0.20)");
              grad.addColorStop(1, "rgba(255, 210, 70, 0)");
            } else {
              grad.addColorStop(0, "rgba(57, 255, 20, 0.14)");
              grad.addColorStop(1, "rgba(57, 255, 20, 0)");
            }
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(thr.x, thr.y);
            ctx.lineTo(ex1, ey1);
            ctx.lineTo(ex2, ey2);
            ctx.closePath();
            ctx.fill();

            // Dashed cone edges so the boundary of the catch zone is legible.
            ctx.strokeStyle = active ? "rgba(255, 214, 70, 0.6)" : "rgba(57, 255, 20, 0.35)";
            ctx.lineWidth = active ? 1.4 : 1;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(thr.x, thr.y);
            ctx.lineTo(ex1, ey1);
            ctx.moveTo(thr.x, thr.y);
            ctx.lineTo(ex2, ey2);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.restore();
          }

          /**
           * Draw every aircraft's drawn/locked flight path. A locked ("cleared to land")
           * route is drawn in a thick, bright amber so it is unmistakable from a pending
           * green route; a cleared aircraft also gets a small amber lock marker at the
           * runway threshold / pad it is cleared into. `blinkOn` (optional) pulses the
           * lock marker so a fresh clearance reads at a glance.
           */
          function drawPaths(ctx, world, blinkOn = true) {
            const ids = world.query(Components.Transform, Components.Path);
            for (const id of ids) {
              const path = world.getComponent(id, Components.Path);
              const poly = path.built && path.built.points.length >= 2
                ? path.built.points
                : path.points;
              if (!poly || poly.length < 2) continue;

              if (path.locked) {
                // Cleared-to-land: a bright amber glow underlay plus a solid thick core so
                // the route pops against the green scope.
                ctx.strokeStyle = "rgba(255, 190, 40, 0.28)";
                ctx.lineWidth = 7;
                ctx.lineCap = "round";
                ctx.setLineDash([]);
                strokePoly(ctx, poly);

                ctx.strokeStyle = "rgba(255, 214, 70, 0.95)";
                ctx.lineWidth = 3.5;
                strokePoly(ctx, poly);
                ctx.lineCap = "butt";
              } else {
                ctx.strokeStyle = "rgba(57, 255, 20, 0.55)";
                ctx.lineWidth = 1.8;
                ctx.setLineDash([4, 4]);
                strokePoly(ctx, poly);
                ctx.setLineDash([]);
              }

              // Lock indicator at the cleared touchdown point (threshold / pad).
              if (path.locked) {
                const ac = world.getComponent(id, Components.Aircraft);
                const c = ac && ac.clearance;
                const mark = c && (c.threshold || c.stop);
                if (mark) drawLockMarker(ctx, mark.x, mark.y, blinkOn);
              }
            }
          }

          /**
           * Draw the in-progress drawn route (display-only preview) as a pending green
           * dashed line, reusing the unlocked-path styling so it reads as "not yet
           * cleared". `preview` is {id, points} or null. The committed Path keeps being
           * drawn by drawPaths; this is only the line under the player's finger.
           */
          function drawDrawPreview(ctx, preview) {
            if (!preview || !preview.points || preview.points.length < 2) return;
            ctx.strokeStyle = "rgba(57, 255, 20, 0.55)";
            ctx.lineWidth = 1.8;
            ctx.setLineDash([4, 4]);
            strokePoly(ctx, preview.points);
            ctx.setLineDash([]);
          }

          /** Stroke an open polyline through the given points. */
          function strokePoly(ctx, poly) {
            ctx.beginPath();
            ctx.moveTo(poly[0].x, poly[0].y);
            for (let i = 1; i < poly.length; i++) ctx.lineTo(poly[i].x, poly[i].y);
            ctx.stroke();
          }

          /** A small amber lock ring + crosshair marking a cleared touchdown point. */
          function drawLockMarker(ctx, x, y, blinkOn) {
            const r = 9;
            ctx.save();
            ctx.strokeStyle = blinkOn ? "rgba(255, 214, 70, 0.95)" : "rgba(255, 214, 70, 0.5)";
            ctx.fillStyle = "rgba(255, 190, 40, 0.18)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            // Short tick marks (a "locked" crosshair).
            ctx.beginPath();
            ctx.moveTo(x - r - 3, y);
            ctx.lineTo(x - r + 3, y);
            ctx.moveTo(x + r - 3, y);
            ctx.lineTo(x + r + 3, y);
            ctx.moveTo(x, y - r - 3);
            ctx.lineTo(x, y - r + 3);
            ctx.moveTo(x, y + r - 3);
            ctx.lineTo(x, y + r + 3);
            ctx.stroke();
            ctx.restore();
          }

          // Fraction of a sweep period over which a stale blip fades from full alpha down
          // to the dim floor. A blip just under one period old is the dimmest before its
          // next refresh; this keeps the "last-known position" feel without going dark.
          const BLIP_FADE_FLOOR = 0.28; // minimum alpha a swept-but-stale blip keeps
          const TRAIL_STEPS = 3; // short fading trail segments behind a fresh blip

          /**
           * Draw each aircraft icon, label, selection highlight and warning blink.
           *
           * Radar-sweep gating (DISPLAY ONLY): each aircraft's shown blip is latched to
           * its TRUE position only when the rotating sweep beam crosses its bearing; in
           * between it holds the last-swept position and fades. The authoritative sim is
           * never consulted here beyond reading true positions to latch. Selected and
           * warning/emergency aircraft are force-latched every frame so a stale blip can
           * never hide an actionable conflict. A plane inside a drifting fog bank (not ILS,
           * not selected) is concealed and shown as a '?' at its last-known position.
           */
          function drawAircraft(ctx, world, game, blinkPhase) {
            const blinkOn = blinkPhase === undefined ? true : blinkPhase < 0.5;
            const ids = world.query(Components.Transform, Components.Aircraft, Components.Render);

            // Radar center is the map center (fall back to the scope center).
            const center =
              game.map && game.map.center
                ? game.map.center
                : { x: game.width / 2, y: game.height / 2 };

            // Build the display-update list: force-latch selected + warning/emergency
            // planes so they always track live and never fade out.
            const planes = [];
            for (const id of ids) {
              const t = world.getComponent(id, Components.Transform);
              const render = world.getComponent(id, Components.Render);
              const ac = world.getComponent(id, Components.Aircraft);
              const selected = game.selectedId === id;
              const force = selected || !!render.warning || !!(ac && ac.emergency);
              planes.push({ render, x: t.x, y: t.y, heading: t.heading, force });
            }

            // Latch last-swept positions for planes the beam crossed this frame. Use the
            // sweep value the render layer last observed (robust to frame/tick decoupling
            // and 2PI wraparound), NOT a dt-derived delta.
            const prevSweep = game._renderPrevSweep == null ? game.sweep : game._renderPrevSweep;
            updateSweepDisplay(game.sweep, prevSweep, game.time, center, planes);
            game._renderPrevSweep = game.sweep;

            // Refresh cadence used for the fade curve.
            const radarLevel =
              (game.upgradeState && game.upgradeState.flags && game.upgradeState.flags.radarLevel) || 0;
            const period = sweepPeriod(radarLevel);

            for (const id of ids) {
              const t = world.getComponent(id, Components.Transform);
              const render = world.getComponent(id, Components.Render);
              const ac = world.getComponent(id, Components.Aircraft);
              const label = world.getComponent(id, Components.Label);
              const def = getAircraftDef(ac.kind);

              const warning = render.warning;
              const selected = game.selectedId === id;
              const important = selected || warning || !!(ac && ac.emergency);

              // Never-swept new spawns are not drawn until the beam first reaches them,
              // so the player genuinely acts on swept information. Important planes are
              // force-latched above and so are always `seen`.
              if (!render.seen) continue;

              // Displayed blip position/heading is the LAST-SWEPT value, not the live one.
              // A selected plane is force-latched to its LIVE position above (force=true
              // makes updateSweepDisplay latch the true x/y/heading every frame), so a
              // communicated-with plane shows its live location even through fog + sweep.
              const dx = render.lastSweepX;
              const dy = render.lastSweepY;
              const dHeading = render.lastSweepHeading;

              // Fog concealment (DISPLAY-ONLY): a plane inside a drifting fog bank is
              // hidden on radar UNLESS it is ILS-equipped or the plane the player has
              // selected/communicated-with. Evaluated at the displayed (last-swept)
              // position so it composes with the sweep gating. When concealed we draw a
              // '?' glyph at the last-known position and set Render.fogHidden (consumed by
              // the flight strips in FEAT-006); otherwise we clear the flag.
              const banks = game.weather && game.weather.fog ? game.weather.fog.banks : null;
              const ilsOwned = !!(game.weather && game.weather.ilsOwned);
              const concealed = fogConceals(banks, dx, dy, { selected, ilsOwned });
              render.fogHidden = concealed;
              if (concealed) {
                drawFogQuestionMark(ctx, dx, dy);
                continue;
              }

              // Sweep fade: full alpha right after a sweep, decaying toward a floor as the
              // blip ages over one refresh period. Important planes stay at full alpha.
              const age = game.time - render.lastSweptTime;
              let sweepAlpha = 1;
              if (!important && period > 0) {
                const frac = Math.max(0, Math.min(1, age / period));
                sweepAlpha = 1 - (1 - BLIP_FADE_FLOOR) * frac;
              }

              const alpha = sweepAlpha;
              if (alpha <= 0.02) continue;

              // Short fading trail from the previous display toward the fresh blip, so a
              // just-refreshed target reads as "newly painted by the sweep".
              if (!important && age >= 0 && age < period * 0.5) {
                const trailFade = 1 - Math.max(0, Math.min(1, age / (period * 0.5)));
                for (let s = 1; s <= TRAIL_STEPS; s++) {
                  const back = (s / (TRAIL_STEPS + 1)) * def.size * 1.5;
                  const tx = dx - Math.cos(dHeading) * back;
                  const ty = dy - Math.sin(dHeading) * back;
                  ctx.save();
                  ctx.globalAlpha = alpha * trailFade * (1 - s / (TRAIL_STEPS + 1)) * 0.5;
                  ctx.fillStyle = render.color;
                  ctx.beginPath();

                  ctx.fill();

              }

              ctx.save();
              ctx.globalAlpha = alpha;
              ctx.translate(dx, dy);

              // Selection ring (drawn unrotated, around the icon).
              if (selected) {
                ctx.strokeStyle = "rgba(255,255,255,0.9)";
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(0, 0, render.size + 6, 0, Math.PI * 2);

              // Proximity warning: pulsing red ring.
              if (warning) {
                ctx.strokeStyle = blinkOn ? "rgba(255,59,48,0.95)" : "rgba(255,59,48,0.35)";
                ctx.lineWidth = 2;

              // Icon oriented to heading (last-swept heading).
              ctx.save();
              ctx.rotate(dHeading);

              ctx.fillStyle = color;
              ctx.strokeStyle = color;
              def.drawShape(ctx, render.size);
              ctx.restore();

              // Label: callsign (follows the blip). A thin dark outline keeps it legible
              // over bright blips and the green sweep fade behind it.
              const cs = label ? label.callsign : "";
              if (cs) {
                ctx.font = '10px "Courier New", monospace';
                const lx = render.size + 4;
                const ly = -4;
                ctx.strokeStyle = "rgba(0,20,5,0.85)";
                ctx.lineWidth = 2.5;

          function drawFogQuestionMark(ctx, x, y) {

            ctx.textBaseline = "middle";

        "src/ui/hud.js": function (exports, require) {
          // On-canvas HUD overlays, drawn by the render system after the world. These are

          //

          //   - drawLowFuelGauges: a small fuel arc over any low-fuel aircraft.
          //   - drawProximityAlarm: a screen-edge red vignette whose intensity tracks the

              const grad = ctx.createRadialGradient(cell.x, cell.y, cell.radius * 0.2, cell.x, cell.y, cell.radius);
              grad.addColorStop(0, "rgba(40,30,60,0.92)");

          /** Draw the hospital POI (world space): a cross marker + range ring. */
          function drawHospital(ctx, hospital) {

          /**
           * Draw the drifting fog bank(s) as translucent rounded-rect regions over the
           * area each covers (WORLD space, so they pan/latch with the field). This is the
           * visible extent of the radar-blocking fog region; the concealment decision for
           * individual planes is made by fogConceals() in the render layer. Takes the
           * published fog snapshot (game.weather.fog = {banks, active}).

          function drawFog(ctx, fog) {
            if (!fog || !fog.banks || fog.banks.length === 0) return;
            ctx.save();
            for (const bank of fog.banks) {
              const r = Math.max(0, bank.radius || 0);
              const w = bank.hx * 2;
              const h = bank.hy * 2;
              const x0 = bank.x - bank.hx;
              const y0 = bank.y - bank.hy;
              // A soft radial fill so the bank reads as a cloud rather than a hard box.
              const grad = ctx.createRadialGradient(
                bank.x, bank.y, Math.min(bank.hx, bank.hy) * 0.2,
                bank.x, bank.y, Math.max(bank.hx, bank.hy)
              );
              grad.addColorStop(0, "rgba(205,212,218,0.42)");
              grad.addColorStop(0.75, "rgba(198,206,214,0.34)");
              grad.addColorStop(1, "rgba(198,206,214,0.06)");
              ctx.fillStyle = grad;
              roundedRectPath(ctx, x0, y0, w, h, r);
              ctx.fill();
              // Faint outline so the blocked area's edge is legible.
              ctx.strokeStyle = "rgba(220,228,235,0.35)";

          }

          /** Trace a rounded-rectangle path (no fill/stroke). Pure-ish ctx helper. */
          function roundedRectPath(ctx, x, y, w, h, r) {
            const rr = Math.max(0, Math.min(r, Math.min(w, h) / 2));
            ctx.beginPath();
            ctx.moveTo(x + rr, y);
            ctx.lineTo(x + w - rr, y);
            ctx.arcTo(x + w, y, x + w, y + rr, rr);
            ctx.lineTo(x + w, y + h - rr);
            ctx.arcTo(x + w, y + h, x + w - rr, y + h, rr);
            ctx.lineTo(x + rr, y + h);
            ctx.arcTo(x, y + h, x, y + h - rr, rr);
            ctx.lineTo(x, y + rr);
            ctx.arcTo(x, y, x + rr, y, rr);
            ctx.closePath();
          }

          /** Draw a wind-direction arrow + label in the top-left corner (screen space). */
          function drawWindIndicator(ctx, weather) {
            if (!weather || weather.windDirection == null) return;
            const ox = 30;
            const oy = 46;
            const len = 14;
            const a = weather.windDirection; // blowing toward
            ctx.save();
            ctx.strokeStyle = "rgba(120,200,255,0.9)";
            ctx.fillStyle = "rgba(120,200,255,0.9)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(ox - Math.cos(a) * len, oy - Math.sin(a) * len);
            ctx.lineTo(ox + Math.cos(a) * len, oy + Math.sin(a) * len);
            ctx.stroke();
            // Arrowhead at the "toward" end.
            const hx = ox + Math.cos(a) * len;
            const hy = oy + Math.sin(a) * len;

        },
        "src/ui/flightStrips.js": function (exports, require) {
          // Flight strips: the scrollable list in the bottom console, one strip per active
          // aircraft. Each strip shows the callsign/ID, a small class badge, a live
          // altitude readout, the ASSIGNED landing surface (with a preferred-vs-forced
          // marker) and a fuel status bar. Tapping a strip selects (COMMUNICATES with)
          // that aircraft: the render layer reveals its live position (even through fog)
          // and highlights the surface it must land on. The camera does NOT move.
          //
          // The strip's overall COLOR follows a strict precedence resolved by the pure
          // helper stripColorState() below, so the decision can be unit-tested without
          // the DOM:
          //   red       (solid)    -> emergency OR low fuel
          //   red-blink (blinking) -> near-collision pair (both planes blink)
          //   grey                 -> concealed by fog AND not the selected/comms plane
          //   blue                 -> routed with a cleared-to-land path
          //   green     (default)  -> unrouted + high fuel
          //
          // Browser-coupled (creates DOM), but constructed only from console.js at start,
          // so the pure modules it imports still load under Node. Strips are added on
          // 'aircraft:spawn' and removed on land/crash/fuel-out.

          const { Components } = require("src/ecs/components.js");
          const { getAircraftDef } = require("src/game/aircraft.js");
          const { fuelStatus } = require("src/game/fuel.js");

          /** The five resolved strip color states, highest precedence first. */
          const STRIP_STATES = Object.freeze([
            "red",
            "red-blink",
            "grey",
            "blue",
            "green",
          ]);

          /**
           * Resolve the single winning color state for a strip from authoritative flags.
           * Pure (no DOM) so it is fully unit-testable. Exactly one state wins, by
           * precedence:
           *   (a) emergency OR low fuel        => 'red'       (solid, highest)
           *   (b) near-collision proximity     => 'red-blink' (both planes of the pair)
           *   (c) fog-hidden AND not selected  => 'grey'
           *   (d) routed to land               => 'blue'
           *   (e) default                      => 'green'
           *
           * @param {object} s
           * @param {boolean} [s.emergency]    aircraft has an active emergency
           * @param {boolean} [s.fuelLow]      fuel is low/critical
           * @param {boolean} [s.proximity]    in a near-collision warned pair
           * @param {boolean} [s.fogHidden]    concealed by the fog region (display flag)
           * @param {boolean} [s.selected]     currently selected / communicating
           * @param {boolean} [s.routedToLand] cleared-to-land path (Path.locked / clearance)
           * @returns {'red'|'red-blink'|'grey'|'blue'|'green'}
           */
          function stripColorState(s = {}) {
            if (s.emergency || s.fuelLow) return "red";
            if (s.proximity) return "red-blink";
            if (s.fogHidden && !s.selected) return "grey";
            if (s.routedToLand) return "blue";
            return "green";
          }

          /**
           * Format the assigned landing surface for display. Pure. Returns a short text
           * token and the mode so the strip can style FORCED vs PREFERRED vs don't-care
           * distinctly:
           *   forced    => { text: '!'+id,  mode: 'forced'   }   hard assignment (lock)
           *   preferred => { text: '->'+id, mode: 'preferred' }  soft preference
           *   any       => { text: 'ANY',   mode: 'any'       }  don't-care
           *
           * @param {object|null} assignment { kind, runwayId?, padId?, mode } or null
           * @returns {{text:string, mode:'forced'|'preferred'|'any'}}
           */
          function assignmentLabel(assignment) {
            if (!assignment || assignment.mode === "any" || assignment.kind === "any") {
              return { text: "ANY", mode: "any" };
            }
            const id = assignment.runwayId || assignment.padId || "";
            if (!id) return { text: "ANY", mode: "any" };
            if (assignment.mode === "forced") return { text: "!" + id, mode: "forced" };
            if (assignment.mode === "preferred") return { text: "\u2192" + id, mode: "preferred" };
            // Unknown mode but a concrete surface: treat as a neutral preference.
            return { text: "\u2192" + id, mode: "preferred" };
          }

          /**
           * Whether a plane's path counts as "routed with a cleared-to-land path" for the
           * blue state. A locked path, or a resolved clearance, both qualify. A holding
           * orbit does NOT (it is not a landing route). Pure helper.
           * @param {object|null} path Path component
           * @param {object|null} ac Aircraft component (carries .clearance)
           */
          function isRoutedToLand(path, ac) {
            if (path && path.locked && !path.holding) return true;
            if (ac && ac.clearance) return true;
            return false;
          }

          /**
           * Create the flight-strip controller.
           * @param {HTMLElement} container the #flight-strips element
           * @param {object} game the game instance (world, camera, selectedId)
           */
          function createFlightStrips(container, game) {
            const { world } = game;
            // Map<entityId, { el, fuelFill, altEl, asgEl }>
            const strips = new Map();

            // A one-line legend so the player can tell the markers apart. Inserted once,
            // ahead of the strip rows (which are appended after it).
            ensureLegend(container);

            function add(id) {
              if (strips.has(id)) return;
              const ac = world.getComponent(id, Components.Aircraft);
              const label = world.getComponent(id, Components.Label);
              if (!ac) return;
              const def = getAircraftDef(ac.kind);

              const el = document.createElement("div");
              el.className = "flight-strip";
              el.dataset.id = String(id);

              const head = document.createElement("div");
              head.className = "strip-head";

              // Small class badge (the class color used to live on the left border, which
              // is now repurposed for the color STATE; the badge keeps class readable).
              const badge = document.createElement("span");
              badge.className = "strip-badge";
              badge.style.background = def.color;
              badge.title = def.name;
              badge.textContent = classAbbrev(def.name);

              const cs = document.createElement("span");
              cs.className = "strip-callsign";
              cs.textContent = label ? label.callsign : "AC" + id;

              const asgEl = document.createElement("span");
              asgEl.className = "strip-assign";

              const altEl = document.createElement("span");
              altEl.className = "strip-alt";
              altEl.textContent = "--";

              head.appendChild(badge);
              head.appendChild(cs);
              head.appendChild(asgEl);
              head.appendChild(altEl);

              const fuelBar = document.createElement("div");
              fuelBar.className = "strip-fuel";
              const fuelFill = document.createElement("div");
              fuelFill.className = "strip-fuel-fill";
              fuelBar.appendChild(fuelFill);

              el.appendChild(head);
              el.appendChild(fuelBar);

              // Tap/click selects (communicates with) the aircraft. No camera move.
              el.addEventListener("click", () => select(id));

              container.appendChild(el);
              strips.set(id, { el, fuelFill, altEl, asgEl });

              // Paint the (static-ish) assignment marker once at creation.
              paintAssignment(asgEl, ac.assignment);
            }

            function remove(id) {
              const strip = strips.get(id);
              if (!strip) return;
              if (strip.el.parentNode) strip.el.parentNode.removeChild(strip.el);
              strips.delete(id);
              if (game.selectedId === id) {
                game.selectedId = null;
              }
            }

            /**
             * Select (COMMUNICATE with) an aircraft: highlight its strip and emit
             * 'aircraft:selected'. This reveals the plane's live position through fog and
             * highlights its assigned surface in the render layer. It does NOT move or
             * recenter the camera — the view stays put.
             */
            function select(id) {
              if (!world.hasEntity || !world.hasEntity(id)) return;
              const wasSelected = game.selectedId === id;
              game.selectedId = id;
              if (!wasSelected && game.bus) game.bus.emit("aircraft:selected", { id });
            }

            /**
             * Refresh every strip's live data (altitude readout + fuel bar), the resolved

        "src/ui/console.js": function (exports, require) {
          // ATC console UI: renders the bottom-25% DOM region — the digital shift clock,
          // the live bank balance, the reputation meter (green -> red), and the flight-
          // strip list. It owns the Bank/Reputation/Clock models and subscribes to the
          // EventBus so gameplay events (spawn/landed/crashed/fuelout/excessivehold/

          //
          // Browser-coupled: constructed by main.js inside start() with the live #console
          // element. The models it uses (economy/reputation/clock) are pure and DOM-free.

          const { createBank, computeLandingRevenue } = require("src/game/economy.js");
          const { createReputation } = require("src/game/reputation.js");
          const { createClock } = require("src/game/clock.js");
          const { createFlightStrips } = require("src/ui/flightStrips.js");

          /**
           * Attach the console to the DOM and wire it to the game's EventBus. Returns an
           * object exposing { bank, reputation, clock, strips, update, detach } so main.js
           * can advance the clock and refresh the view each frame.
           *
           * @param {object} game the game instance (bus, world, camera, ...)
           * @param {object} [dom] element overrides (defaults resolve by id)
           */
          function createConsole(game, dom = {}) {
            const root = dom.root || document.getElementById("console");
            const clockEl = dom.clockEl || document.getElementById("shift-clock");
            const bankEl = dom.bankEl || document.getElementById("bank-balance");
            const meterEl = dom.meterEl || document.getElementById("reputation-meter");
            const fillEl =
              dom.fillEl || (meterEl ? meterEl.querySelector(".reputation-fill") : null);
            const stripsEl = dom.stripsEl || document.getElementById("flight-strips");

            const bank = createBank(game.startingBalance ?? 0);
            const reputation = createReputation();
            const clock = createClock(game.clockOptions ?? {});
            const strips = stripsEl ? createFlightStrips(stripsEl, game) : null;

            // Audio mute/volume control wired into the console header. It unlocks the
            // AudioContext on first use (a user gesture) and toggles the master gain.

            // Expose the models on the game so other systems / later features can read
            // them (e.g. the FEAT-005 upgrade shop reads game.bank).
            game.bank = bank;
            game.reputation = reputation;
            game.clock = clock;

            const unsubscribers = [];
            const on = (ev, fn) => unsubscribers.push(game.bus.on(ev, fn));

            on("aircraft:spawn", ({ id }) => {

            const prog = () => game.progression;

              reputation.recover();

                prog().recordLanding(revenue);
                if (payload && payload._emergency) prog().recordEmergency();

              if (strips) strips.remove(payload.id);

            on("aircraft:crashed", (payload) => {
              reputation.penalize("crash");
              if (prog()) prog().recordIncident("crash");

                if (payload && payload.b != null) strips.remove(payload.b);

              render();

              if (prog()) prog().recordIncident("fuelOut");
              if (strips && payload) strips.remove(payload.id);
              checkFired();
              render();
            });

            on("aircraft:stormloss", () => {
              if (prog()) prog().recordIncident("stormLoss");

            });

            on("aircraft:nearmiss", () => {
              reputation.penalize("nearMiss");
              if (prog()) prog().recordIncident("nearMiss");
              checkFired();
              render();
            });

            on("aircraft:excessivehold", () => {
              reputation.penalize("excessiveHold");
              if (prog()) prog().recordIncident("excessiveHold");
              checkFired();

             * shift clock to zero. The bank balance PERSISTS across shifts (earned money
             * carries over to the upgrade shop). Flight strips are cleared.

            function resetForShift() {

           * Returns { detach } to remove the inserted nodes. Browser-only (called from
           * createConsole, which only runs with a live DOM).

            const row = clockEl && clockEl.parentNode ? clockEl.parentNode : null;
            if (!row) return { detach() {} };

            const wrap = document.createElement("span");
            wrap.className = "audio-control console-field";

            const muteBtn = document.createElement("button");
            muteBtn.className = "audio-mute";
            muteBtn.type = "button";
            muteBtn.setAttribute("aria-label", "Toggle sound");

            const slider = document.createElement("input");
            slider.className = "audio-volume";
            slider.type = "range";
            slider.min = "0";
            slider.max = "100";
            slider.value = String(Math.round(audio.volume * 100));
            slider.setAttribute("aria-label", "Volume");

            function refresh() {
              muteBtn.textContent = audio.muted ? "\u{1F507}" : "\u{1F50A}"; // muted/speaker
              muteBtn.classList.toggle("muted", audio.muted);

            const onMute = () => {
              audio.unlock(); // first gesture unlock
              audio.toggleMute();
              refresh();
            };
            const onVol = () => {
              audio.unlock();
              audio.setVolume(Number(slider.value) / 100);
              refresh();
            };
            muteBtn.addEventListener("click", onMute);
            slider.addEventListener("input", onVol);

            wrap.appendChild(muteBtn);
            wrap.appendChild(slider);
            row.appendChild(wrap);
            refresh();

            return {
              detach() {
                muteBtn.removeEventListener("click", onMute);
                slider.removeEventListener("input", onVol);
                if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
              },

          }

          /** Format a whole-dollar balance like "$1,250". Pure helper. */
          function formatMoney(amount) {
            const n = Math.round(amount);

          function reputationColor(fraction) {
            const f = Math.max(0, Math.min(1, fraction));
            // Hue 0 (red) at 0 to 120 (green) at 1.
            const hue = Math.round(120 * f);
            return `hsl(${hue}, 100%, 50%)`;
          }


          exports.createConsole = createConsole;
          exports.formatMoney = formatMoney;
          exports.reputationColor = reputationColor;
        },
        "src/ui/screens.js": function (exports, require) {
          // Screen manager: portrait DOM overlays for the game's non-radar states —
          // Main Menu / map select, in-game (no overlay), End-of-Shift Summary, the
          // Upgrade Shop, and Game Over (crash or fired). Transitions are driven by

           *   - Summary -> Shop -> next map (loadMap + resume).

              game.bus.on("level:over", (p) => {
                const reason = (p && p.reason) || game.gameOverReason;
                const survived = false;

              current = SCREEN.MENU;
              game.paused = true;
              const prog = game.progression;
              mount.innerHTML = "";
              const panel = makePanel("ATC SIMULATOR", "Select a map to begin your shift.");

              const grid = el("div", "map-grid");
              MAP_META.forEach((m, i) => {
                const unlocked = prog.isMapUnlocked(i);
                const card = el("button", "map-card" + (unlocked ? "" : " locked"));
                card.disabled = !unlocked;
                card.innerHTML =
                  `<span class="map-name">${m.name}</span>` +
                  `<span class="map-blurb">${unlocked ? m.blurb : "Locked - survive earlier shifts"}</span>`;

                  if (!prog.selectMap(i)) return;
                  startShiftOnSelectedMap();

              const mapId = game.progression.currentMapId();

              summary.reason = reason || null;

              if (game.gameOver) return;

                ["Revenue", formatMoney(summary.revenue)],
                ["Target", formatMoney(summary.target) + (summary.metTarget ? " (met)" : " (missed)")],
                ["Bonus", formatMoney(summary.bonus)],

            function showMount() {
              if (mount) mount.classList.add("visible");

            function hideMount() {
              if (mount) mount.classList.remove("visible");
            }

              for (const u of unsub) u();
              unsub.length = 0;
              if (mount) mount.innerHTML = "";
            }

            showMenu();

              show,
              showMenu,
              showShop,
              showSummary,

              detach,
              get current() {
                return current;

          // --- tiny DOM helpers ------------------------------------------------------

          function el(tag, className) {
            const e = document.createElement(tag);
            if (className) e.className = className;
            return e;
          }

          function makePanel(title, subtitle) {
            const panel = el("div", "screen-panel");
            const h = el("h1", "screen-title");
            h.textContent = title;
            panel.appendChild(h);
            if (subtitle) {

              s.textContent = subtitle;
              panel.appendChild(s);
            }
            return panel;
          }

          function makeStatTable(rows) {
            const table = el("div", "stat-table");
            for (const [label, value] of rows) {

              l.textContent = label;
              const v = el("span", "stat-value");
              v.textContent = String(value);
              row.appendChild(l);
              row.appendChild(v);
              table.appendChild(row);
            }
            return table;
          }


          exports.createScreens = createScreens;
        },
        "src/ui/input.js": function (exports, require) {

              y -= height / 2 - camera.target.y;
