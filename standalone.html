            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(text, width / 2, h / 2);
            ctx.textAlign = "left";
            ctx.textBaseline = "alphabetic";
            ctx.restore();
          }


          exports.applyCamera = applyCamera;
          exports.drawLowFuelGauges = drawLowFuelGauges;
          exports.drawProximityAlarm = drawProximityAlarm;
          exports.drawStorms = drawStorms;
          exports.drawHospital = drawHospital;
          exports.aircraftFogAlpha = aircraftFogAlpha;
          exports.drawFog = drawFog;
          exports.drawWindIndicator = drawWindIndicator;
          exports.drawEmergencyFlash = drawEmergencyFlash;
          exports.drawEventBanner = drawEventBanner;
        },
        "src/ui/flightStrips.js": function (exports, require) {
          // Flight strips: the scrollable list in the bottom console, one strip per active
          // aircraft. Each strip shows the callsign/ID, class, a live altitude readout
          // (derived/animated from how long the plane has been inbound) and a fuel status
          // bar. Tapping a strip selects that aircraft and centers the camera on it (the
          // render system reads game.camera.target).
          //
          // Browser-coupled (creates DOM), but constructed only from console.js at start,
          // so the pure modules it imports still load under Node. Strips are added on
          // 'aircraft:spawn' and removed on land/crash/fuel-out.

          const { Components } = require("src/ecs/components.js");
          const { getAircraftDef } = require("src/game/aircraft.js");
          const { fuelStatus } = require("src/game/fuel.js");

          /**
           * Create the flight-strip controller.
           * @param {HTMLElement} container the #flight-strips element
           * @param {object} game the game instance (world, camera, selectedId)
           */
          function createFlightStrips(container, game) {
            const { world } = game;
            // Map<entityId, { el, fuelFill, altEl }>
            const strips = new Map();

            function add(id) {
              if (strips.has(id)) return;
              const ac = world.getComponent(id, Components.Aircraft);
              const label = world.getComponent(id, Components.Label);
              if (!ac) return;
              const def = getAircraftDef(ac.kind);

              const el = document.createElement("div");
              el.className = "flight-strip";
              el.dataset.id = String(id);
              el.style.borderLeftColor = def.color;

              const head = document.createElement("div");
              head.className = "strip-head";

              const cs = document.createElement("span");
              cs.className = "strip-callsign";
              cs.textContent = label ? label.callsign : "AC" + id;

              const kindEl = document.createElement("span");
              kindEl.className = "strip-kind";
              kindEl.textContent = def.name;

              const altEl = document.createElement("span");
              altEl.className = "strip-alt";
              altEl.textContent = "--";

              head.appendChild(cs);
              head.appendChild(kindEl);
              head.appendChild(altEl);

              const fuelBar = document.createElement("div");
              fuelBar.className = "strip-fuel";
              const fuelFill = document.createElement("div");
              fuelFill.className = "strip-fuel-fill";
              fuelBar.appendChild(fuelFill);

              el.appendChild(head);
              el.appendChild(fuelBar);

              // Tap/click selects the aircraft and centers the camera on it.
              el.addEventListener("click", () => select(id));

              container.appendChild(el);
              strips.set(id, { el, fuelFill, altEl });
            }

            function remove(id) {
              const strip = strips.get(id);
              if (!strip) return;
              if (strip.el.parentNode) strip.el.parentNode.removeChild(strip.el);
              strips.delete(id);
              if (game.selectedId === id) {
                game.selectedId = null;
                if (game.camera) game.camera.target = null;
              }
            }

            /** Select an aircraft: highlight its strip and center the camera on it. */
            function select(id) {
              if (!world.hasEntity || !world.hasEntity(id)) return;
              game.selectedId = id;
              const t = world.getComponent(id, Components.Transform);
              if (t && game.camera) {
                game.camera.target = { x: t.x, y: t.y };
                game.camera.followId = id;
              }
            }

            /**
             * Refresh every strip's live data (altitude readout + fuel bar) and the
             * selected-strip highlight. Also keeps the camera target tracking a followed
             * plane. Called from console.update() each render.
             */
            function refresh() {
              for (const [id, strip] of strips) {
                if (!world.hasEntity(id)) continue;
                const ac = world.getComponent(id, Components.Aircraft);
                const fuel = world.getComponent(id, Components.Fuel);

                // Altitude: a cosmetic readout. Inbound planes descend from ~8000ft toward
                // the pattern altitude; derived from how long they have been in airspace.
                const tis = Math.max(0, game.time - (ac?.spawnTime ?? game.time));
                const alt = Math.max(1200, Math.round((8000 - tis * 60) / 100) * 100);
                strip.altEl.textContent = (ac?.state === "landing" ? "LAND" : alt + "ft");

                if (fuel) {
                  const st = fuelStatus(fuel);
                  strip.fuelFill.style.width = Math.round(st.fraction * 100) + "%";
                  strip.el.classList.toggle("fuel-low", st.low && !st.critical);
                  strip.el.classList.toggle("fuel-critical", st.critical);
                }

                strip.el.classList.toggle("selected", game.selectedId === id);
              }

              // Keep the camera centered on the followed plane as it moves.
              if (game.camera && game.camera.followId != null) {
                const fid = game.camera.followId;
                if (world.hasEntity(fid)) {
                  const t = world.getComponent(fid, Components.Transform);
                  if (t) game.camera.target = { x: t.x, y: t.y };
                } else {
                  game.camera.followId = null;
                  game.camera.target = null;
                }
              }
            }

            /** Remove every strip (e.g. on game over / reset). */
            function clear() {
              for (const id of Array.from(strips.keys())) remove(id);
            }

            return { add, remove, select, refresh, clear, strips };
          }


          exports.createFlightStrips = createFlightStrips;
        },
        "src/ui/console.js": function (exports, require) {
          // ATC console UI: renders the bottom-25% DOM region — the digital shift clock,
          // the live bank balance, the reputation meter (green -> red), and the flight-
          // strip list. It owns the Bank/Reputation/Clock models and subscribes to the
          // EventBus so gameplay events (spawn/landed/crashed/fuelout/excessivehold/
          // near-miss) update the economy + reputation and refresh the display.
          //
          // Browser-coupled: constructed by main.js inside start() with the live #console
          // element. The models it uses (economy/reputation/clock) are pure and DOM-free.

          const { createBank, computeLandingRevenue } = require("src/game/economy.js");
          const { createReputation } = require("src/game/reputation.js");
          const { createClock } = require("src/game/clock.js");
          const { createFlightStrips } = require("src/ui/flightStrips.js");

          /**
           * Attach the console to the DOM and wire it to the game's EventBus. Returns an
           * object exposing { bank, reputation, clock, strips, update, detach } so main.js
           * can advance the clock and refresh the view each frame.
           *
           * @param {object} game the game instance (bus, world, camera, ...)
           * @param {object} [dom] element overrides (defaults resolve by id)
           */
          function createConsole(game, dom = {}) {
            const root = dom.root || document.getElementById("console");
            const clockEl = dom.clockEl || document.getElementById("shift-clock");
            const bankEl = dom.bankEl || document.getElementById("bank-balance");
            const meterEl = dom.meterEl || document.getElementById("reputation-meter");
            const fillEl =
              dom.fillEl || (meterEl ? meterEl.querySelector(".reputation-fill") : null);
            const stripsEl = dom.stripsEl || document.getElementById("flight-strips");

            const bank = createBank(game.startingBalance ?? 0);
            const reputation = createReputation();
            const clock = createClock(game.clockOptions ?? {});
            const strips = stripsEl ? createFlightStrips(stripsEl, game) : null;

            // Audio mute/volume control wired into the console header. It unlocks the
            // AudioContext on first use (a user gesture) and toggles the master gain.
            const audioControl = game.audio ? buildAudioControl(game.audio, clockEl) : null;

            // Expose the models on the game so other systems / later features can read
            // them (e.g. the FEAT-005 upgrade shop reads game.bank).
            game.bank = bank;
            game.reputation = reputation;
            game.clock = clock;

            const unsubscribers = [];
            const on = (ev, fn) => unsubscribers.push(game.bus.on(ev, fn));

            on("aircraft:spawn", ({ id }) => {
              if (strips) strips.add(id);
            });

            // Record into the shift progression (for the end-of-shift summary) if present.
            const prog = () => game.progression;

            on("aircraft:landed", (payload) => {
              const revenue = computeLandingRevenue(payload);
              bank.credit(revenue);
              reputation.recover();
              if (prog()) {
                prog().recordLanding(revenue);
                if (payload && payload._emergency) prog().recordEmergency();
              }
              if (strips) strips.remove(payload.id);
              render();
            });

            on("aircraft:crashed", (payload) => {
              reputation.penalize("crash");
              if (prog()) prog().recordIncident("crash");
              if (strips) {
                if (payload && payload.a != null) strips.remove(payload.a);
                if (payload && payload.b != null) strips.remove(payload.b);
              }
              render();
            });

            on("aircraft:fuelout", (payload) => {
              reputation.penalize("fuelOut");
              if (prog()) prog().recordIncident("fuelOut");
              if (strips && payload) strips.remove(payload.id);
              checkFired();
              render();
            });

            on("aircraft:stormloss", () => {
              if (prog()) prog().recordIncident("stormLoss");
              render();
            });

            on("aircraft:nearmiss", () => {
              reputation.penalize("nearMiss");
              if (prog()) prog().recordIncident("nearMiss");
              checkFired();
              render();
            });

            on("aircraft:excessivehold", () => {
              reputation.penalize("excessiveHold");
              if (prog()) prog().recordIncident("excessiveHold");
              checkFired();
              render();
            });

            /** If reputation bottomed out, end the game as a firing. */
            function checkFired() {
              if (reputation.isFired() && !game.gameOver) {
                game.gameOver = true;
                game.gameOverReason = "fired";
                game.bus.emit("level:over", { reason: "fired" });
              }
            }

            /** Paint the static fields (clock/bank/reputation). */
            function render() {
              if (clockEl) clockEl.textContent = clock.format();
              if (bankEl) bankEl.textContent = formatMoney(bank.balance);
              if (fillEl) {
                const frac = reputation.fraction();
                fillEl.style.width = Math.round(frac * 100) + "%";
                fillEl.style.background = reputationColor(frac);
              }
            }

            /**
             * Called each frame from main.js. Advances the shift clock to match sim time
             * and refreshes the strips + static fields.
             */
            function update() {
              clock.setElapsed(game.time);
              if (strips) strips.refresh();
              render();
            }

            // Initial paint.
            render();

            /**
             * Reset the per-shift state for a new shift: reputation back to full and the
             * shift clock to zero. The bank balance PERSISTS across shifts (earned money
             * carries over to the upgrade shop). Flight strips are cleared.
             */
            function resetForShift() {
              const fresh = createReputation();
              reputation.score = fresh.score;
              reputation.incidents = fresh.incidents;
              clock.setElapsed(0);
              if (strips) strips.clear();
              render();
            }

            function detach() {
              for (const un of unsubscribers) un();
              unsubscribers.length = 0;
              if (strips) strips.clear();
              if (audioControl) audioControl.detach();
            }

            return { bank, reputation, clock, strips, update, render, detach, resetForShift, audioControl, root };
          }

          /**
           * Build a compact mute/volume control and insert it into the console header
           * (next to the shift clock). Clicking the mute button unlocks the AudioContext
           * on the user gesture, then toggles mute; the slider sets the master volume.
           * Returns { detach } to remove the inserted nodes. Browser-only (called from
           * createConsole, which only runs with a live DOM).
           */
          function buildAudioControl(audio, clockEl) {
            const row = clockEl && clockEl.parentNode ? clockEl.parentNode : null;
            if (!row) return { detach() {} };

            const wrap = document.createElement("span");
            wrap.className = "audio-control console-field";

            const muteBtn = document.createElement("button");
            muteBtn.className = "audio-mute";
            muteBtn.type = "button";
            muteBtn.setAttribute("aria-label", "Toggle sound");

            const slider = document.createElement("input");
            slider.className = "audio-volume";
            slider.type = "range";
            slider.min = "0";
            slider.max = "100";
            slider.value = String(Math.round(audio.volume * 100));
            slider.setAttribute("aria-label", "Volume");

            function refresh() {
              muteBtn.textContent = audio.muted ? "\u{1F507}" : "\u{1F50A}"; // muted/speaker
              muteBtn.classList.toggle("muted", audio.muted);
            }

            const onMute = () => {
              audio.unlock(); // first gesture unlock
              audio.toggleMute();
              refresh();
            };
            const onVol = () => {
              audio.unlock();
              audio.setVolume(Number(slider.value) / 100);
              refresh();
            };
            muteBtn.addEventListener("click", onMute);
            slider.addEventListener("input", onVol);

            wrap.appendChild(muteBtn);
            wrap.appendChild(slider);
            row.appendChild(wrap);
            refresh();

            return {
              detach() {
                muteBtn.removeEventListener("click", onMute);
                slider.removeEventListener("input", onVol);
                if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
              },
            };
          }

          /** Format a whole-dollar balance like "$1,250". Pure helper. */
          function formatMoney(amount) {
            const n = Math.round(amount);
            const sign = n < 0 ? "-" : "";
            const abs = Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            return sign + "$" + abs;
          }

          /** Meter color shifting green -> yellow -> red as reputation drops. Pure. */
          function reputationColor(fraction) {
            const f = Math.max(0, Math.min(1, fraction));
            // Hue 0 (red) at 0 to 120 (green) at 1.
            const hue = Math.round(120 * f);
            return `hsl(${hue}, 100%, 50%)`;
          }


          exports.createConsole = createConsole;
          exports.formatMoney = formatMoney;
          exports.reputationColor = reputationColor;
        },
        "src/ui/screens.js": function (exports, require) {
          // Screen manager: portrait DOM overlays for the game's non-radar states —
          // Main Menu / map select, in-game (no overlay), End-of-Shift Summary, the
          // Upgrade Shop, and Game Over (crash or fired). Transitions are driven by
          // progression (shift start/end) and by reputation/crash events ('level:over').
          //
          // Browser-coupled: constructed by main.js inside start() with the live #screens
          // mount. All the logic it drives (progression, upgrades, economy) lives in pure
          // modules so this file is a thin view/controller layer.

          const { MAP_META } = require("src/game/maps.js");
          const { UPGRADES, purchase } = require("src/game/upgrades.js");
          const { formatMoney } = require("src/ui/console.js");

          const SCREEN = Object.freeze({
            NONE: "none",
            MENU: "menu",
            SUMMARY: "summary",
            SHOP: "shop",
            GAMEOVER: "gameover",
          });

          /**
           * Create the screen manager. Returns { show, detach, current } and takes over
           * showing menus / transitioning shifts. It:
           *   - shows the Main Menu + map select at boot,
           *   - on 'level:over' freezes the sim and shows Summary (survived vs fired/crash),
           *   - Summary -> Shop -> next map (loadMap + resume).
           *
           * @param {object} game the live game instance (progression, bank, loadMap, ...)
           * @param {object} [dom] { mount } overrides (defaults to #screens)
           */
          function createScreens(game, dom = {}) {
            const mount = dom.mount || document.getElementById("screens");
            const unsub = [];
            let current = SCREEN.NONE;
            let lastSummary = null;

            // When a level ends (crash or fired), pause the sim and show the summary.
            unsub.push(
              game.bus.on("level:over", (p) => {
                const reason = (p && p.reason) || game.gameOverReason;
                const survived = false;
                endCurrentShift(survived, reason);
              })
            );

            /** Show the Main Menu with the map-select grid. */
            function showMenu() {
              current = SCREEN.MENU;
              game.paused = true;
              const prog = game.progression;
              mount.innerHTML = "";
              const panel = makePanel("ATC SIMULATOR", "Select a map to begin your shift.");

              const grid = el("div", "map-grid");
              MAP_META.forEach((m, i) => {
                const unlocked = prog.isMapUnlocked(i);
                const card = el("button", "map-card" + (unlocked ? "" : " locked"));
                card.disabled = !unlocked;
                card.innerHTML =
                  `<span class="map-name">${m.name}</span>` +
                  `<span class="map-blurb">${unlocked ? m.blurb : "Locked - survive earlier shifts"}</span>`;
                card.addEventListener("click", () => {
                  if (!prog.selectMap(i)) return;
                  startShiftOnSelectedMap();
                });
                grid.appendChild(card);
              });
              panel.appendChild(grid);
              mount.appendChild(panel);
              showMount();
            }

            /** Begin a shift on the currently selected map. */
            function startShiftOnSelectedMap() {
              const mapId = game.progression.currentMapId();
              game.loadMap(mapId);
              hideMount();
              current = SCREEN.NONE;
              game.paused = false;
            }

            /** End the current shift and show the summary screen. */
            function endCurrentShift(survived, reason) {
              game.paused = true;
              const repScore = game.reputation ? game.reputation.score : 100;
              const summary = game.progression.endShift({ reputationScore: repScore, survived });
              summary.reason = reason || null;
              lastSummary = summary;
              showSummary(summary);
            }

            /** Called by main.js when the shift clock runs out (a survived shift). */
            function onShiftClockExpired() {
              if (current !== SCREEN.NONE) return;
              if (game.gameOver) return;
              endCurrentShift(true, "shift-complete");
            }

            /** Show the End-of-Shift summary. */
            function showSummary(summary) {
              current = SCREEN.SUMMARY;
              mount.innerHTML = "";
              const survived = summary.survived;
              const title = survived
                ? "SHIFT COMPLETE"
                : summary.reason === "collision"
                ? "SHIFT ENDED - COLLISION"
                : "SHIFT ENDED - FIRED";
              const panel = makePanel(title, survived ? "Nice work keeping the skies clear." : "Review the shift and try again.");

              const rows = [
                ["Planes landed", summary.landed],
                ["Revenue", formatMoney(summary.revenue)],
                ["Target", formatMoney(summary.target) + (summary.metTarget ? " (met)" : " (missed)")],
                ["Bonus", formatMoney(summary.bonus)],
                ["Emergencies handled", summary.emergenciesHandled],
                ["Crashes", summary.crashed],
                ["Final reputation", Math.round(summary.reputation)],
                ["Total earned", formatMoney(summary.total)],
              ];
              panel.appendChild(makeStatTable(rows));

              const next = el("button", "screen-btn");
              next.textContent = survived ? "To Upgrade Shop" : "Main Menu";
              next.addEventListener("click", () => {
                if (survived) showShop();
                else {
                  // A failed shift returns to the menu to retry (no unlock advance).
                  game.progression.advance({ survived: false });
                  showMenu();
                }
              });

              mount.appendChild(panel);
              showMount();
            }

            /** Show the Upgrade Shop. */
            function showShop() {
              current = SCREEN.SHOP;
              renderShop();
              showMount();
            }

            function renderShop() {
              mount.innerHTML = "";
              const bank = game.bank;
              const panel = makePanel("UPGRADE SHOP", "Spend earnings to improve your field.");

              const balance = el("div", "shop-balance");
              balance.textContent = "Balance: " + formatMoney(bank ? bank.balance : 0);
              panel.appendChild(balance);

              const list = el("div", "shop-list");
              for (const up of UPGRADES) {
                const owned = up.repeatable ? false : game.upgradeState.owned.includes(up.id);
                const affordable = bank && bank.canAfford(up.cost);
                const item = el("div", "shop-item");
                item.innerHTML =
                  `<div class="shop-item-head"><span class="shop-cat">${up.category}</span>` +
                  `<span class="shop-cost">${formatMoney(up.cost)}</span></div>` +
                  `<div class="shop-label">${up.label}</div>` +
                  `<div class="shop-desc">${up.description}</div>`;
                const buy = el("button", "shop-buy");
                buy.textContent = owned ? "Owned" : "Buy";
                buy.disabled = owned || !affordable;
                buy.addEventListener("click", () => {
                  const res = purchase(game.upgradeState, bank, up.id);

                    syncFlags();

                item.appendChild(buy);
                list.appendChild(item);
              }
              panel.appendChild(list);

              const done = el("button", "screen-btn");
              done.textContent = "Start Next Shift";
              done.addEventListener("click", () => {

                showMenu();
              });

              mount.appendChild(panel);
            }

            /**
             * Mirror upgrade flags onto the live game so systems pick them up. Notably
             * game.ilsOwned must flip true for fog landings (the fog/landing code reads
             * it). Infrastructure/radar effects already mutate the live map in place.

              const f = game.upgradeState.flags || {};
              if (f.ilsOwned) game.ilsOwned = true;
              if (game.weather) game.weather.ilsOwned = game.ilsOwned;
            }

            /** Show the Main Menu. */
            function show(screen) {
              if (screen === SCREEN.MENU) showMenu();
              else if (screen === SCREEN.SHOP) showShop();
              else if (screen === SCREEN.SUMMARY && lastSummary) showSummary(lastSummary);
              else hideMount();

            function showMount() {
              if (mount) mount.classList.add("visible");
            }
            function hideMount() {
              if (mount) mount.classList.remove("visible");
            }

            function detach() {
              for (const u of unsub) u();
              unsub.length = 0;
              if (mount) mount.innerHTML = "";
            }

            // Boot into the main menu.
            showMenu();

            return {
              show,
              showMenu,
              showShop,
              showSummary,
              onShiftClockExpired,
              syncFlags,
              detach,
              get current() {
                return current;
              },
              SCREEN,
            };
          }

          // --- tiny DOM helpers ------------------------------------------------------

          function el(tag, className) {
            const e = document.createElement(tag);
            if (className) e.className = className;
            return e;
          }

          function makePanel(title, subtitle) {
            const panel = el("div", "screen-panel");
            const h = el("h1", "screen-title");
            h.textContent = title;
            panel.appendChild(h);
            if (subtitle) {
              const s = el("p", "screen-sub");
              s.textContent = subtitle;
              panel.appendChild(s);
            }
            return panel;
          }

          function makeStatTable(rows) {
            const table = el("div", "stat-table");
            for (const [label, value] of rows) {
              const row = el("div", "stat-row");
              const l = el("span", "stat-label");
              l.textContent = label;
              const v = el("span", "stat-value");
              v.textContent = String(value);
              row.appendChild(l);
              row.appendChild(v);
              table.appendChild(row);
            }
            return table;
          }


          exports.createScreens = createScreens;
        },
        "src/ui/input.js": function (exports, require) {
          // Pointer-based path drawing (touch AND mouse via Pointer Events). Browser-
          // coupled module: it is only ever constructed by main.js inside start(), so the
          // pure modules it imports keep loading under Node. The pure coordinate-mapping
          // and point-throttling helpers are exported separately for reuse/testing.
          //
          // Interaction:
          //   pointerdown on an aircraft hitbox  -> begin drawing a route from the plane
          //   pointermove                        -> append throttled points (live path)
          //   pointerup                          -> finalize: set the plane's Path; if the
          //                                         endpoint falls in a runway approach
          //                                         cone (correct angle) or on the helipad,
