<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#001405" />
    <title>ATC Simulator</title>
    <!--
      SELF-CONTAINED BUILD. This single file bundles index.html + css/style.css +
      every src/**/*.js module so the game plays directly from the local
      filesystem (file://), with no server and no network access. Regenerate with:
        node scripts/bundle.mjs
      Do not edit this file by hand; edit the source under src/ and rebuild.

    <style>
/* ATC Simulator - portrait-first, CRT radar aesthetic.
   Layout: full viewport flex column. Radar area flex 3 (~75%),
   console area flex 1 (~25%). Touch gestures are suppressed on the canvas. */

:root {
  --crt-green: #39ff14;
  --crt-green-dim: rgba(57, 255, 20, 0.5);
  --crt-bg: #001405;
  --console-bg: #04210b;
  --danger: #ff3b30;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  color: var(--crt-green);
  font-family: "Courier New", Courier, monospace;
  /* Prevent accidental text selection during touch drags. */
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  /* Honor device safe areas (notches, home indicator). */
  padding: env(safe-area-inset-top) env(safe-area-inset-right)
    env(safe-area-inset-bottom) env(safe-area-inset-left);
}

#game-root {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
}

#radar-canvas {
  flex: 3 1 0;
  width: 100%;
  min-height: 0;
  display: block;
  background: var(--crt-bg);
  /* Stop the browser from hijacking touch drags for scroll/zoom. */
  touch-action: none;
}

#console {
  flex: 1 1 0;
  min-height: 0;
  background: var(--console-bg);
  border-top: 2px solid var(--crt-green-dim);
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  overflow: hidden;
}

.console-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.console-field {
  font-size: clamp(14px, 4.5vw, 22px);
  letter-spacing: 1px;
  text-shadow: 0 0 6px var(--crt-green-dim);
}

.audio-control {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
}

.audio-mute {
  background: transparent;
  border: 1px solid var(--crt-green-dim);
  border-radius: 4px;
  color: var(--crt-green);
  font-size: 14px;
  line-height: 1;
  padding: 2px 6px;
  cursor: pointer;
}

.audio-mute.muted {
  color: #ff6a60;
  border-color: #ff6a60;
}

.audio-volume {
  width: 64px;
  accent-color: var(--crt-green);
}

.reputation-meter {
  flex: 1;
  height: 10px;
  border: 1px solid var(--crt-green-dim);
  border-radius: 5px;
  overflow: hidden;
}

.reputation-fill {
  height: 100%;
  width: 100%;
  background: var(--crt-green);
  box-shadow: 0 0 8px var(--crt-green-dim);
  transition: width 0.3s ease;
}

.flight-strips {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 4px;
  -webkit-overflow-scrolling: touch;
}

/* One-line legend above the strip list: explains the preferred-vs-forced
   markers so the player can read the assignment tokens on each strip. */
.strip-legend {
  flex: 0 0 auto;
  font-size: clamp(9px, 2.6vw, 11px);
  color: var(--crt-green-dim);
  letter-spacing: 0.5px;
  padding: 1px 2px 3px;
  border-bottom: 1px dashed rgba(57, 255, 20, 0.25);
  margin-bottom: 1px;
}

/* Individual flight strip: tappable row with a class badge, callsign, assigned
   surface, altitude and a fuel bar. The LEFT BORDER + background now encode the
   resolved color STATE (see strip-state-* below); the aircraft class lives in a
   small badge instead of the old class-colored border. */
.flight-strip {
  border: 1px solid var(--crt-green-dim);
  border-left: 4px solid var(--crt-green);
  border-radius: 3px;
  padding: 3px 6px;
  background: rgba(57, 255, 20, 0.05);
  cursor: pointer;
  flex: 0 0 auto;
}

/* --- Resolved color states (exactly one applies per strip) --------------- */

/* green: default — unrouted, high fuel. */
.flight-strip.strip-state-green {
  border-left-color: var(--crt-green);
  background: rgba(57, 255, 20, 0.05);
}

/* blue: routed with a cleared-to-land path. */
.flight-strip.strip-state-blue {
  border-left-color: #3ba7ff;
  background: rgba(59, 167, 255, 0.12);
}

/* grey: concealed by fog and not the selected/communicating plane. */
.flight-strip.strip-state-grey {
  border-left-color: #9aa0a6;
  background: rgba(154, 160, 166, 0.12);
  color: rgba(220, 220, 220, 0.7);
}

/* red (solid): emergency or low fuel. */
.flight-strip.strip-state-red {
  border-left-color: var(--danger);
  background: rgba(255, 59, 48, 0.18);
}

/* red-blink: near-collision pair — both strips blink red. */
.flight-strip.strip-state-red-blink {
  border-left-color: var(--danger);
  animation: strip-blink-red 0.6s steps(2, start) infinite;
}

/* Selected highlight stays visible ON TOP of any state color. */
.flight-strip.selected {
  background: rgba(255, 255, 255, 0.12);
  border-color: #fff;
  box-shadow: 0 0 6px rgba(255, 255, 255, 0.5);
}

@keyframes strip-blink-red {
  to {
    background: rgba(255, 59, 48, 0.32);
    border-left-color: #fff;
  }
}

.strip-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: clamp(11px, 3.2vw, 14px);
}

.strip-callsign {
  font-weight: bold;
  letter-spacing: 1px;
}

.strip-kind {
  color: var(--crt-green-dim);
  font-size: 0.8em;
}

.strip-alt {
  margin-left: auto;
  color: rgba(220, 255, 210, 0.9);
  font-size: 0.85em;
}

.strip-fuel {
  margin-top: 3px;
  height: 4px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.12);
  overflow: hidden;
}

.strip-fuel-fill {
  height: 100%;
  width: 100%;
  background: var(--crt-green);
  transition: width 0.2s linear;
}

/* The fuel BAR stays as the live gauge: it tints toward danger as it empties,
   independent of the strip-level state (low fuel also drives the red state). */
.flight-strip.strip-state-blue .strip-fuel-fill {
  background: #3ba7ff;
}

.flight-strip.strip-state-red .strip-fuel-fill,
.flight-strip.strip-state-red-blink .strip-fuel-fill {
  background: var(--danger);
}

.flight-strip.strip-state-grey .strip-fuel-fill {
  background: #9aa0a6;
}

/* Class badge: small colored chip carrying the aircraft class abbreviation. */
.strip-badge {
  flex: 0 0 auto;
  font-size: 0.68em;
  font-weight: bold;
  letter-spacing: 0.5px;
  color: #001405;
  padding: 0 4px;
  border-radius: 2px;
  line-height: 1.4;
}

/* Assigned landing surface marker. Forced vs preferred vs any are visually
   distinct (also spelled out in the .strip-legend above the list). */
.strip-assign {
  margin-left: 6px;
  font-size: 0.82em;
  font-weight: bold;
  letter-spacing: 0.5px;
}

.strip-assign.asg-forced,
.strip-legend .asg-forced {
  color: #ff7a3c;
  text-shadow: 0 0 4px rgba(255, 122, 60, 0.6);
}

.strip-assign.asg-preferred,
.strip-legend .asg-preferred {
  color: #8fd0ff;
}

.strip-assign.asg-any,
.strip-legend .asg-any {
  color: var(--crt-green-dim);
  font-weight: normal;
}

/* --- Screen overlays (menu / summary / shop / game over) ----------------- */

.screens {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(0, 10, 4, 0.92);
  z-index: 20;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.screens.visible {
  display: flex;
}

.screen-panel {
  width: 100%;
  max-width: 460px;
  margin: auto;
  background: var(--console-bg);
  border: 2px solid var(--crt-green-dim);
  border-radius: 8px;
  padding: 18px 16px;
  box-shadow: 0 0 24px rgba(57, 255, 20, 0.2);
}

.screen-title {
  font-size: clamp(18px, 6vw, 28px);
  letter-spacing: 2px;
  text-shadow: 0 0 8px var(--crt-green-dim);
  margin-bottom: 6px;
}

.screen-sub {
  color: rgba(220, 255, 210, 0.75);
  font-size: clamp(12px, 3.4vw, 15px);
  margin-bottom: 14px;
}

.map-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}

.map-card {
  display: flex;
  flex-direction: column;
  gap: 4px;
  text-align: left;
  padding: 12px;
  background: rgba(57, 255, 20, 0.06);
  border: 1px solid var(--crt-green-dim);
  border-radius: 6px;
  color: var(--crt-green);
  font-family: inherit;
  cursor: pointer;
}

.map-card:hover:not(.locked) {
  background: rgba(57, 255, 20, 0.14);
}

.map-card.locked {
  opacity: 0.4;
  cursor: not-allowed;
}

.map-name {
  font-weight: bold;
  letter-spacing: 1px;
  font-size: clamp(14px, 4vw, 18px);
}

.map-blurb {
  font-size: clamp(11px, 3vw, 13px);
  color: rgba(220, 255, 210, 0.7);
}

.stat-table {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 14px;
}

.stat-row {
  display: flex;
  justify-content: space-between;
  border-bottom: 1px dashed var(--crt-green-dim);
  padding: 3px 0;
  font-size: clamp(12px, 3.4vw, 15px);
}

.stat-value {
  color: rgba(220, 255, 210, 0.95);
  font-weight: bold;
}

.shop-balance {
  font-size: clamp(14px, 4.2vw, 18px);
  margin-bottom: 10px;
  text-shadow: 0 0 6px var(--crt-green-dim);
}

.shop-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 14px;
}

.shop-item {
  border: 1px solid var(--crt-green-dim);
  border-radius: 6px;
  padding: 8px 10px;
  background: rgba(57, 255, 20, 0.05);
}

.shop-item-head {
  display: flex;
  justify-content: space-between;
  font-size: 0.8em;
  color: var(--crt-green-dim);
}

.shop-label {
  font-weight: bold;
  letter-spacing: 1px;
  margin: 2px 0;
}

.shop-desc {
  font-size: 0.85em;
  color: rgba(220, 255, 210, 0.7);
  margin-bottom: 6px;
}

.screen-btn,
.shop-buy {
  font-family: inherit;
  color: #001405;
  background: var(--crt-green);
  border: none;
  border-radius: 5px;
  padding: 8px 14px;
  font-weight: bold;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow: 0 0 8px var(--crt-green-dim);
}

.screen-btn {
  width: 100%;
  margin-top: 6px;
  font-size: clamp(14px, 4vw, 17px);
  padding: 12px;
}

.shop-buy:disabled,
.screen-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  box-shadow: none;
}

    </style>
  </head>
  <body>
    <div id="game-root">
      <!-- Radar scope: top ~75% of the viewport. -->
      <canvas id="radar-canvas"></canvas>

      <!-- ATC console: bottom ~25%. Populated by later features. -->
      <section id="console" aria-label="ATC console">
        <div class="console-row">
          <span id="shift-clock" class="console-field">06:00</span>
          <span id="bank-balance" class="console-field">$0</span>
        </div>
        <div class="console-row">
          <div id="reputation-meter" class="reputation-meter">
            <div class="reputation-fill"></div>
          </div>
        </div>
        <div id="flight-strips" class="flight-strips" aria-label="Flight strips"></div>
      </section>

      <!-- Screen overlays (main menu / map select / summary / shop / game over).
           Populated and shown/hidden by src/ui/screens.js. -->
      <div id="screens" class="screens" aria-live="polite"></div>
    </div>
  
    <script>
      (function () {
        "use strict";
        // CommonJS-style module registry. Each factory runs once; its exports object
        // is cached. Isolated scopes => no cross-module identifier collisions.
        var __factories = {
        "src/core/vec2.js": function (exports, require) {
          // Pure 2D vector math. Operates on plain {x, y} objects and returns new objects
          // (except scalar-returning helpers). Zero DOM/canvas dependencies so this module
          // is fully unit-testable under Node.

          /** Create a vector. */
          function vec2(x = 0, y = 0) {
            return { x, y };
          }

          /** a + b */
          function add(a, b) {
            return { x: a.x + b.x, y: a.y + b.y };
          }

          /** a - b */
          function sub(a, b) {
            return { x: a.x - b.x, y: a.y - b.y };
          }

          /** a * s (scalar) */
          function scale(a, s) {
            return { x: a.x * s, y: a.y * s };
          }

          /** Euclidean length of a. */
          function length(a) {
            return Math.hypot(a.x, a.y);
          }

          /** Squared length (cheaper, avoids sqrt). */
          function lengthSq(a) {
            return a.x * a.x + a.y * a.y;
          }

          /** Unit vector in the direction of a. Returns {0,0} for the zero vector. */
          function normalize(a) {
            const len = Math.hypot(a.x, a.y);
            if (len === 0) return { x: 0, y: 0 };
            return { x: a.x / len, y: a.y / len };
          }

          /** Distance between a and b. */
          function distance(a, b) {
            return Math.hypot(a.x - b.x, a.y - b.y);
          }

          /** Squared distance between a and b. */
          function distanceSq(a, b) {
            const dx = a.x - b.x;
            const dy = a.y - b.y;
            return dx * dx + dy * dy;
          }

          /** Dot product. */
          function dot(a, b) {
            return a.x * b.x + a.y * b.y;
          }

          /** Angle of vector a in radians, measured from +x axis. */
          function angle(a) {
            return Math.atan2(a.y, a.x);
          }

          /** Angle in radians from a to b. */
          function angleBetween(a, b) {
            return Math.atan2(b.y - a.y, b.x - a.x);
          }

          /** Linear interpolation between a and b by t in [0,1]. */
          function lerp(a, b, t) {
            return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
          }

          /** Rotate vector a by angle (radians) around the origin. */
          function rotate(a, radians) {
            const cos = Math.cos(radians);
            const sin = Math.sin(radians);
            return { x: a.x * cos - a.y * sin, y: a.x * sin + a.y * cos };
          }

          /** Return a copy of the vector. */
          function clone(a) {
            return { x: a.x, y: a.y };
          }


          exports.vec2 = vec2;
          exports.add = add;
          exports.sub = sub;
          exports.scale = scale;
          exports.length = length;
          exports.lengthSq = lengthSq;
          exports.normalize = normalize;
          exports.distance = distance;
          exports.distanceSq = distanceSq;
          exports.dot = dot;
          exports.angle = angle;
          exports.angleBetween = angleBetween;
          exports.lerp = lerp;
          exports.rotate = rotate;
          exports.clone = clone;
        },
        "src/core/rng.js": function (exports, require) {
          // Seedable pseudo-random number generator (mulberry32). Deterministic for a
          // fixed seed so spawning and events are reproducible and testable. Pure module.

          /**
           * Create a deterministic RNG seeded by an integer.
           * @param {number} seed - 32-bit unsigned seed.
           */
          function createRng(seed = 1) {
            // Coerce to a 32-bit unsigned integer state.
            let state = seed >>> 0;

            /** Next float in [0, 1). */
            function next() {
              state |= 0;
              state = (state + 0x6d2b79f5) | 0;
              let t = Math.imul(state ^ (state >>> 15), 1 | state);
              t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
              return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            }

            /** Float in [min, max). */
            function range(min, max) {
              return min + next() * (max - min);
            }

            /** Integer in [min, max] inclusive. */
            function rangeInt(min, max) {
              return Math.floor(min + next() * (max - min + 1));
            }

            /** Pick a random element from a non-empty array. */
            function pick(array) {
              if (!array || array.length === 0) return undefined;
              return array[Math.floor(next() * array.length)];
            }

            /** Return true with probability p in [0, 1]. */
            function chance(p) {
              return next() < p;
            }

            return { next, range, rangeInt, pick, chance };
          }


          exports.createRng = createRng;
        },
        "src/core/spline.js": function (exports, require) {
          // Catmull-Rom spline utilities for the touch-drawn flight paths. Includes an
          // arc-length reparameterization so an aircraft can move at a constant speed
          // along the path regardless of control-point spacing. Pure module.

          /**
           * Sample a Catmull-Rom spline defined by `points` at parameter t in [0, 1].
           * The curve passes through every control point. Endpoints are duplicated so the
           * first and last segments are well defined.
           * @param {{x:number,y:number}[]} points
           * @param {number} t global parameter in [0,1]
           * @returns {{x:number,y:number}}
           */
          function sampleSpline(points, t) {
            const n = points.length;
            if (n === 0) return { x: 0, y: 0 };
            if (n === 1) return { x: points[0].x, y: points[0].y };
            if (n === 2) {
              // Straight line interpolation for two points.
              return {
                x: points[0].x + (points[1].x - points[0].x) * t,
                y: points[0].y + (points[1].y - points[0].y) * t,
              };
            }

            const clamped = Math.max(0, Math.min(1, t));
            const segments = n - 1;
            const scaled = clamped * segments;
            let i = Math.floor(scaled);
            if (i >= segments) i = segments - 1;
            const localT = scaled - i;

            const p0 = points[Math.max(0, i - 1)];
            const p1 = points[i];
            const p2 = points[i + 1];
            const p3 = points[Math.min(n - 1, i + 2)];

            return catmullRom(p0, p1, p2, p3, localT);
          }

          /** Catmull-Rom interpolation for a single segment (p1 -> p2). */
          function catmullRom(p0, p1, p2, p3, t) {
            const t2 = t * t;
            const t3 = t2 * t;
            return {
              x:
                0.5 *
                (2 * p1.x +
                  (-p0.x + p2.x) * t +
                  (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 +
                  (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
              y:
                0.5 *
                (2 * p1.y +
                  (-p0.y + p2.y) * t +
                  (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 +
                  (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3),
            };
          }

          /**
           * Build a dense polyline from control points together with cumulative arc
           * lengths, enabling constant-speed traversal. The polyline samples the smooth
           * Catmull-Rom curve.
           * @param {{x:number,y:number}[]} points control points
           * @param {number} samplesPerSegment resolution per segment
           * @returns {{points:{x:number,y:number}[], cumulative:number[], length:number}}
           */
          function buildPath(points, samplesPerSegment = 16) {
            if (!points || points.length === 0) {
              return { points: [], cumulative: [], length: 0 };
            }
            if (points.length === 1) {
              const p = { x: points[0].x, y: points[0].y };
              return { points: [p], cumulative: [0], length: 0 };
            }

            const segments = points.length - 1;
            const totalSamples = segments * samplesPerSegment;
            const poly = [];
            const cumulative = [];
            let accumulated = 0;

            for (let s = 0; s <= totalSamples; s++) {
              const t = s / totalSamples;
              const pt = sampleSpline(points, t);
              if (poly.length > 0) {
                const prev = poly[poly.length - 1];
                accumulated += Math.hypot(pt.x - prev.x, pt.y - prev.y);
              }
              poly.push(pt);
              cumulative.push(accumulated);
            }

            return { points: poly, cumulative, length: accumulated };
          }

          /**
           * Find the point along a built path at a given arc-length distance. Distances
           * are clamped to the path's [0, length] range.
           * @param {{points:{x:number,y:number}[], cumulative:number[], length:number}} path
           * @param {number} dist arc length from the start
           * @returns {{x:number,y:number}}
           */
          function pointAtDistance(path, dist) {
            const { points, cumulative, length } = path;
            if (!points || points.length === 0) return { x: 0, y: 0 };
            if (points.length === 1) return { x: points[0].x, y: points[0].y };

            const d = Math.max(0, Math.min(length, dist));

            // Binary search for the segment whose cumulative length brackets d.
            let lo = 0;
            let hi = cumulative.length - 1;
            while (lo < hi) {
              const mid = (lo + hi) >> 1;
              if (cumulative[mid] < d) lo = mid + 1;
              else hi = mid;
            }

            const i = Math.max(1, lo);
            const segStart = cumulative[i - 1];
            const segEnd = cumulative[i];
            const segLen = segEnd - segStart;
            const localT = segLen > 0 ? (d - segStart) / segLen : 0;

            const a = points[i - 1];
            const b = points[i];
            return {
              x: a.x + (b.x - a.x) * localT,
              y: a.y + (b.y - a.y) * localT,
            };
          }


          exports.sampleSpline = sampleSpline;
          exports.buildPath = buildPath;
          exports.pointAtDistance = pointAtDistance;
        },
        "src/core/spatialHash.js": function (exports, require) {
          // Uniform-grid spatial hash for broad-phase collision detection. Buckets entity
          // ids into fixed-size cells; queryNeighbors returns candidate ids within the
          // cells overlapping a query circle (broad phase: a precise distance test should
          // follow in the caller). Pure module, no DOM dependency.

          function createSpatialHash(cellSize = 64) {
            if (cellSize <= 0) throw new Error("cellSize must be positive");

        "src/game/pathUtils.js": function (exports, require) {

          // so the simulation math is unit-testable under Node without any DOM. Used by

          const { buildPath, pointAtDistance } = require("src/core/spline.js");
          const { normalizeAngle } = require("src/game/airport.js");

           * The turn angle (radians, >= 0) at an interior control point: how sharply the
           * path bends when going from the incoming segment to the outgoing segment. A
           * straight line has turn angle 0; a full reversal approaches PI.
           */
          function turnAngleAt(prev, pt, next) {
            const inHeading = Math.atan2(pt.y - prev.y, pt.x - prev.x);
            const outHeading = Math.atan2(next.y - pt.y, next.x - pt.x);
            return Math.abs(normalizeAngle(outHeading - inHeading));

           * angle. Returns {ok, worstAngle, worstIndex}. Degenerate (zero-length)
           * segments are skipped. Pure function.
           * @param {{x:number,y:number}[]} points
           * @param {number} maxTurnAngle radians
           */
          function validateTurns(points, maxTurnAngle) {
            let worstAngle = 0;
            let worstIndex = -1;
            for (let i = 1; i < points.length - 1; i++) {
              const prev = points[i - 1];
              const pt = points[i];
              const next = points[i + 1];
              if (
                (prev.x === pt.x && prev.y === pt.y) ||
                (next.x === pt.x && next.y === pt.y)
              ) {
                continue;
              }
              const a = turnAngleAt(prev, pt, next);
              if (a > worstAngle) {
                worstAngle = a;
                worstIndex = i;
              }
            }
            return { ok: worstAngle <= maxTurnAngle, worstAngle, worstIndex };
          }

          /**
           * Clamp a raw list of drawn control points so no corner exceeds the class turn
           * limit. Points that would create an over-sharp corner are dropped. The first
           * and last points are always kept. Pure function. Returns a new array.
           */
          function clampTurns(points, maxTurnAngle) {
            if (points.length <= 2) return points.slice();
            const out = [points[0]];

              const pt = points[i];
              const next = points[i + 1];
              const a = turnAngleAt(prev, pt, next);
              if (a <= maxTurnAngle) out.push(pt);

            }

           * Heading is derived from a short look-ahead so the icon faces travel direction.
           * Pure function.
           * @param {object} built result of buildPath
           * @param {number} dist arc length from the start

              heading = Math.atan2(pos.y - behind.y, pos.x - behind.x);
            } else {
              heading = Math.atan2(ahead.y - pos.y, ahead.x - pos.x);
            }

          }

          exports.clampTurns = clampTurns;
          exports.sampleAlong = sampleAlong;
        },
        "src/game/weather.js": function (exports, require) {
          // Weather: pure, DOM-free decision logic and geometry for the three weather
          // hazards (wind shifts, drifting thunderstorm cells, fog). Rendering of storms /
          // fog / the wind arrow lives in the HUD/render system; everything here is plain
          // math + state so it can be unit-tested under Node.
          //
          //   WIND SHIFT  - flips the active approach direction so a runway that used to
          //                 accept an approach from one end now accepts the opposite end.
          //                 landingSystem consults isApproachDirectionValid() to decide
          //                 whether a resolved landing direction is currently legal.
          //   THUNDERSTORM- opaque circular cells with a position, radius and drift
          //                 velocity. Each tick the cell drifts; a plane whose position
          //                 (or drawn route) intersects a cell is destroyed / loses nav.
          //   FOG         - a MOVING REGION (a drifting "bank") that conceals only the
          //                 part of the scope it covers. A plane inside the bank is hidden
          //                 on radar (shows a '?' at its last-known position) unless it is
          //                 ILS-equipped or the player has selected/communicated with it.
          //                 Concealment is DISPLAY-ONLY; the sim runs on true positions.

          const { normalizeAngle, angleDifference } = require("src/game/airport.js");

          // --- Wind -----------------------------------------------------------------

          /**
           * Whether a resolved landing direction is valid for the current wind. Aircraft
           * must land into the wind, so the legal approach direction is the one pointing
           * OPPOSITE the wind's "blowing toward" heading, within a tolerance. A wind shift
           * rotates `windDirection` so the previously-correct end becomes invalid and the
           * opposite end becomes valid.
           *
           * `windDirection` is the compass heading the wind is blowing TOWARD (radians).
           * A plane lands into the wind, i.e. its travel heading should oppose the wind,
           * so a landing direction `landingHeading` is valid when it is roughly opposite
           * the wind direction. Pure function.
           *
           * @param {number} landingHeading the direction the aircraft travels on rollout
           * @param {number} windDirection direction the wind blows toward (radians)
           * @param {number} [tolerance] half-angle of the acceptable window (radians)
           * @returns {boolean}
           */
          function isApproachDirectionValid(landingHeading, windDirection, tolerance = Math.PI / 2) {
            // Landing into the wind: ideal landing heading is opposite the wind.
            const ideal = normalizeAngle(windDirection + Math.PI);
            return angleDifference(landingHeading, ideal) <= tolerance;
          }

          /**
           * The currently-legal LANDING DIRECTIONS (travel headings on rollout) for a
           * runway under a wind state. At steady state exactly ONE of a runway's two ends
           * is into the wind and therefore legal. During a wind-shift transition window
           * BOTH the end that is into the CURRENT wind and the end that was into the
           * PREVIOUS wind are legal, so the player can keep routing to the old end while
           * the shift settles.
           *
           * The runway is bidirectional: its two candidate landing headings are
           * `runway.heading` and its reciprocal. A heading is legal when it is into the
           * current wind (isApproachDirectionValid vs windDirection) OR, during an active
           * transition, into the previous wind (vs windPrevDirection).
           *
           * Pure function. `windState` is a plain snapshot:
           *   { windDirection, windTolerance?, transition?: { active, fromDirection } }
           * `fromDirection` is the PREVIOUS wind direction (blowing-toward heading).
           *
           * @param {object} runway runway with a base `heading`
           * @param {object} windState wind snapshot
           * @returns {number[]} normalized legal landing headings (0, 1 or 2 entries)
           */
          function activeLandingDirections(runway, windState) {
            if (!runway || !windState || windState.windDirection == null) return [];
            const tol = windState.windTolerance ?? WEATHER_DEFAULTS.windTolerance;
            const transition = windState.transition;
            const prevDir =
              transition && transition.active && transition.fromDirection != null
                ? transition.fromDirection
                : null;
            const ends = [normalizeAngle(runway.heading), normalizeAngle(runway.heading + Math.PI)];
            const out = [];
            for (const dir of ends) {
              const intoCurrent = isApproachDirectionValid(dir, windState.windDirection, tol);
              const intoPrev = prevDir != null && isApproachDirectionValid(dir, prevDir, tol);
              if (intoCurrent || intoPrev) out.push(dir);

            return out;

           *
           * @param {number} landingHeading travel heading on rollout
           * @param {object} windState wind snapshot (see activeLandingDirections)
           * @param {number} [tol] half-angle window (defaults to windState.windTolerance)

            if (landingHeading == null || !windState || windState.windDirection == null) return true;
            const tolerance = tol ?? windState.windTolerance ?? WEATHER_DEFAULTS.windTolerance;
            if (isApproachDirectionValid(landingHeading, windState.windDirection, tolerance)) return true;
            const transition = windState.transition;

              y: opts.y ?? 0,
              vx: opts.vx ?? 0,
              vy: opts.vy ?? 0,

            const dy = b.y - a.y;
            const lenSq = dx * dx + dy * dy;
            let t = 0;
            if (lenSq > 0) {

            const cy = a.y + dy * t;

          /**
           * Create a fog bank. A rounded-rect region with a center (x,y), half-extents
           * (hx,hy) and a drift velocity (vx,vy) in px / px per second. `radius` rounds

            const hy = opts.hy ?? 120;

              id: opts.id ?? 0,
              x: opts.x ?? 0,
              y: opts.y ?? 0,
              hx,
              hy,
              vx: opts.vx ?? 0,
              vy: opts.vy ?? 0,
              radius: Math.max(0, Math.min(opts.radius ?? Math.min(hx, hy) * 0.5, Math.min(hx, hy))),

            bank.y += bank.vy * dt;
            if (Number.isFinite(bank.life)) bank.life -= dt;

           * Whether a point lies inside a fog bank (rounded-rectangle test). Pure.
           * The rounded-rect is the Minkowski sum of an inner rectangle (half-extents
           * hx-r, hy-r) and a disc of radius r, so the test is: clamp the point to the
           * inner rectangle, then check the distance to that clamp is <= r.
           */
          function isPointInFog(bank, x, y) {
            if (!bank) return false;
            const r = bank.radius || 0;
            const ix = Math.max(0, bank.hx - r);
            const iy = Math.max(0, bank.hy - r);
            let dx = Math.abs(x - bank.x) - ix;
            let dy = Math.abs(y - bank.y) - iy;
            if (dx <= 0 && dy <= 0) return true; // inside the inner rectangle

            stormRadius: [46, 78],
            stormSpeed: [10, 26], // px/s drift

            fogMaxInterval: 110,
            fogDuration: [25, 50],

            // the field from an edge. Half-extents are a FRACTION of the field size so a
            // bank can conceal a large part of the map; speed is px/s drift.
            fogBankHalfSpan: [0.32, 0.5], // half-extent as a fraction of field width/height
            fogBankSpeed: [8, 20], // px/s drift
            windTolerance: Math.PI / 2,

            windTransitionSeconds: 8,

           * reads the resulting state; emitting HUD banners is the system's job.
           *

           */
          function createWeatherController(opts = {}) {

            const map = opts.map;

            const state = {

              // (heading 0, landing toward +x) is valid: wind blowing toward -x (west).

              windTolerance: cfg.windTolerance,
              // Wind-shift transition window. When a shift occurs we record the previous
              // wind direction and open a timer; while the timer is active BOTH the old
              // and new into-wind ends are routable. After it elapses only the new end is.
              windPrevDirection: null,
              windTransition: { active: false, fromDirection: null, toDirection: null, remaining: 0 },
              storms: [],
              // Active fog banks (moving regions). Empty when no fog episode is running.
              fogBanks: [],

            // Schedule timers (seconds of sim time until the next event of each type).
            let windTimer = randRange(cfg.windShiftMinInterval, cfg.windShiftMaxInterval);
            let stormTimer = randRange(cfg.stormMinInterval, cfg.stormMaxInterval);
            let fogTimer = randRange(cfg.fogMinInterval, cfg.fogMaxInterval);

            /**
             * Rotate the wind so the opposite approach becomes the valid one, and OPEN a
             * transition window during which BOTH the old and new into-wind ends stay
             * routable. The previous wind direction is recorded so landing legality and
             * the direction indicator can treat both ends as active until the window
             * closes.
             */
            function shiftWind() {

              // reversal but stays within the new opposite window.
              const jitter = rng ? rng.range(-0.3, 0.3) : 0;
              const prev = state.windDirection;
              state.windDirection = normalizeAngle(state.windDirection + Math.PI + jitter);
              state.windPrevDirection = prev;
              state.windTransition = {
                active: true,
                fromDirection: prev,
                toDirection: state.windDirection,
                remaining: cfg.windTransitionSeconds,
              };
              return state.windDirection;
            }

            /** Current wind snapshot shape consumed by the pure direction helpers. */
            function windStateSnapshot() {
              return {
                windDirection: state.windDirection,
                windTolerance: state.windTolerance,
                transition: {
                  active: state.windTransition.active,
                  fromDirection: state.windTransition.fromDirection,
                  toDirection: state.windTransition.toDirection,
                  remaining: state.windTransition.remaining,
                },
              };
            }

            /** Spawn a storm cell drifting across the field from a random edge. */
            function spawnStorm() {
              const w = map ? map.width : 400;
              const h = map ? map.height : 600;
              const cx = map ? map.center.x : w / 2;
              const cy = map ? map.center.y : h / 2;
              // Start just off one edge and drift toward/across the field.
              const edge = rng ? rng.rangeInt(0, 3) : 0;
              const radius = randRange(cfg.stormRadius[0], cfg.stormRadius[1]);
              let x;
              let y;
              if (edge === 0) { x = -radius; y = randRange(0, h); }
              else if (edge === 1) { x = w + radius; y = randRange(0, h); }
              else if (edge === 2) { x = randRange(0, w); y = -radius; }
              else { x = randRange(0, w); y = h + radius; }
              // Drift roughly toward the field center with scatter.
              const toCenter = Math.atan2(cy - y, cx - x) + (rng ? rng.range(-0.5, 0.5) : 0);
              const speed = randRange(cfg.stormSpeed[0], cfg.stormSpeed[1]);
              const cell = createStormCell({
                id: state._nextStormId++,
                x,
                y,
                vx: Math.cos(toCenter) * speed,
                vy: Math.sin(toCenter) * speed,
                radius,
                life: randRange(cfg.stormLife[0], cfg.stormLife[1]),
              });
              state.storms.push(cell);
              return cell;
            }

            /**
             * Spawn a fog bank drifting across the field from a random edge. The bank is
             * a large rounded-rect (half-extents a fraction of the field) that enters from
             * just off one edge and drifts toward/across the field, concealing the part of
             * the scope it covers until it clears (life) or drifts well off the field.
             */
            function spawnFogBank() {
              const w = map ? map.width : 400;
              const h = map ? map.height : 600;
              const cx = map ? map.center.x : w / 2;
              const cy = map ? map.center.y : h / 2;
              const hx = randRange(cfg.fogBankHalfSpan[0], cfg.fogBankHalfSpan[1]) * w;
              const hy = randRange(cfg.fogBankHalfSpan[0], cfg.fogBankHalfSpan[1]) * h;
              const edge = rng ? rng.rangeInt(0, 3) : 0;
              let x;
              let y;
              if (edge === 0) { x = -hx; y = randRange(0, h); }
              else if (edge === 1) { x = w + hx; y = randRange(0, h); }
              else if (edge === 2) { x = randRange(0, w); y = -hy; }
              else { x = randRange(0, w); y = h + hy; }
              const toCenter = Math.atan2(cy - y, cx - x) + (rng ? rng.range(-0.4, 0.4) : 0);
              const speed = randRange(cfg.fogBankSpeed[0], cfg.fogBankSpeed[1]);
              const bank = createFogBank({
                id: state._nextFogId++,
                x,
                y,
                hx,
                hy,
                vx: Math.cos(toCenter) * speed,
                vy: Math.sin(toCenter) * speed,
                radius: Math.min(hx, hy) * 0.4,
                life: randRange(cfg.fogDuration[0], cfg.fogDuration[1]),
              });
              state.fogBanks.push(bank);
              return bank;
            }

            /**
             * Advance weather by dt. Returns a list of event objects that occurred this
             * tick, e.g. [{type:'wind'}, {type:'storm', cell}, {type:'fog', on:true}].
             * The caller (weatherSystem) turns these into HUD banners / EventBus emits.
             */
            function update(dt) {
              const events = [];

              // Drift existing storms and retire expired / far-gone ones.
              const bounds = map ? Math.max(map.width, map.height) : 600;
              for (const cell of state.storms) driftStorm(cell, dt);
              state.storms = state.storms.filter((c) => {
                if (Number.isFinite(c.life) && c.life <= 0) return false;
                // Drop cells that have drifted well off the field.
                const cx = map ? map.center.x : 200;
                const cy = map ? map.center.y : 300;
                if (Math.hypot(c.x - cx, c.y - cy) > bounds * 1.2 + c.radius) return false;
                return true;
              });

              // Wind shift schedule.
              windTimer -= dt;
              if (windTimer <= 0) {
                windTimer = randRange(cfg.windShiftMinInterval, cfg.windShiftMaxInterval);
                shiftWind();
                events.push({
                  type: "wind",
                  windDirection: state.windDirection,
                  transition: true,
                  fromDirection: state.windTransition.fromDirection,
                });
              }

              // Advance the transition window; close it (only the new end stays legal)
              // when the timer elapses.
              if (state.windTransition.active) {
                state.windTransition.remaining -= dt;
                if (state.windTransition.remaining <= 0) {
                  state.windTransition.active = false;
                  state.windTransition.remaining = 0;

          //

          // shorter time in the airspace earns an efficiency bonus):
          //   revenue = round( (base[kind] + passengers * perPassenger[kind]) * efficiency )

            [AircraftKind.SUPERSONIC]: 40,
            [AircraftKind.COMMERCIAL]: 12,

          // full EFFICIENCY_MAX across a normal slow route, and the decay happens over a
          // comparable player-difficulty window rather than expiring before a normal route

        "src/ecs/world.js": function (exports, require) {
          // Entity-Component-System World. Entities are integer ids. Components are plain
          // data objects stored in a Map keyed by component name, each holding a
          // Map<entityId, data>. Systems (defined elsewhere) are plain functions that
          // query the world each tick. Pure module: no DOM/canvas dependency.

          function createWorld() {
            let nextId = 1;

            // Set of live entity ids.
            const entities = new Set();

            // Map<componentName:string, Map<entityId:number, data:object>>
            const components = new Map();

            /** Allocate a new entity id. */
            function createEntity() {
              const id = nextId++;
              entities.add(id);
              return id;
            }

            /** Destroy an entity and strip all of its components. */
            function destroyEntity(id) {
              if (!entities.has(id)) return;
              entities.delete(id);
              for (const store of components.values()) store.delete(id);
            }

            /** Whether an entity id is currently alive. */
            function hasEntity(id) {
              return entities.has(id);
            }

            /** Attach (or replace) a component of `name` on an entity. Returns the data. */
            function addComponent(id, name, data) {
              let store = components.get(name);
              if (!store) {
                store = new Map();
                components.set(name, store);
              }
              store.set(id, data);
              return data;
            }

            /** Get a component's data for an entity, or undefined. */
            function getComponent(id, name) {
              const store = components.get(name);
              return store ? store.get(id) : undefined;
            }

            /** Whether an entity has a component. */
            function hasComponent(id, name) {
              const store = components.get(name);
              return store ? store.has(id) : false;
            }

            /** Remove a component from an entity. */
            function removeComponent(id, name) {
              const store = components.get(name);
              if (store) store.delete(id);
            }

            /**
             * Query entity ids that possess all of the given component names.
             * @param {...string} names
             * @returns {number[]}
             */
            function query(...names) {
              if (names.length === 0) return Array.from(entities);

              // Start from the smallest component store to minimize iteration.
              let smallest = null;
              for (const name of names) {
                const store = components.get(name);
                if (!store) return []; // No entity can match a missing component.
                if (smallest === null || store.size < smallest.size) smallest = store;
              }

              const result = [];
              for (const id of smallest.keys()) {
                let matches = true;
                for (const name of names) {
                  if (!components.get(name).has(id)) {
                    matches = false;
                    break;
                  }
                }
                if (matches) result.push(id);
              }
              return result;
            }

            /** Number of live entities. */
            function entityCount() {
              return entities.size;
            }

            /** Remove every entity and component (used when loading a new map/shift). */
            function clear() {
              entities.clear();
              for (const store of components.values()) store.clear();
            }

            return {
              createEntity,
              destroyEntity,
              hasEntity,
              addComponent,
              getComponent,
              hasComponent,
              removeComponent,
              query,
              entityCount,
              clear,
            };
          }


          exports.createWorld = createWorld;
        },
        "src/ecs/systems/spawnSystem.js": function (exports, require) {
          // Spawn system. Emits a continuous stream of inbound aircraft from the radar
          // perimeter at a controlled, time-ramping rate using the seeded RNG so a shift
          // is reproducible. Each spawn gets a kind, a callsign, fuel, a heading aimed
          // roughly toward the field, and an initial short path so it drifts inbound until
          // the controller draws a route. Emits 'aircraft:spawn'.

          const { Components } = require("src/ecs/components.js");
          const { Transform, Velocity, Aircraft, Path, Hitbox, Render, Fuel, Label } = require("src/ecs/components.js");
          const { ALL_KINDS, getAircraftDef, AircraftKind, assignLandingTarget } = require("src/game/aircraft.js");

          const CALLSIGN_PREFIX = {
            [AircraftKind.LIGHT]: "N",
            [AircraftKind.COMMERCIAL]: "AC",
            [AircraftKind.HELICOPTER]: "H",
            [AircraftKind.SUPERSONIC]: "SR",
          };

          /**
           * Compute the spawn interval (seconds) at a given elapsed shift time. Starts
           * relaxed and ramps up (shorter interval) as the shift progresses, floored so
           * the field never becomes impossible. Pure function.
           */
          function spawnInterval(shiftTime) {
            // FEAT-003: aircraft now cruise at 0.25x (another ~4x slower), so each plane
            // lingers in the airspace much longer before it reaches a runway. At the old
            // cadence that would pile up the standing-aircraft count, so the base and
            // floor intervals are lengthened (8.5->14, 3.2->5.5) to keep peak crowding
            // comparable to the pre-slowdown balance.
            const base = 14; // seconds between spawns at the start
            const floor = 5.5; // never faster than this
            const ramp = Math.min(1, shiftTime / 300); // fully ramped after 5 minutes
            return base - (base - floor) * ramp;
          }

          /** Build the ECS spawn system bound to a game instance. */
          function createSpawnSystem(game) {
            const { world, bus, rng } = game;

            let timer = 0;
            let serial = 0;

            function makeCallsign(kind) {
              serial += 1;
              const prefix = CALLSIGN_PREFIX[kind] ?? "AC";
              const num = 100 + (serial % 900);
              return prefix + num;
            }

            function spawnOne() {
              const map = game.map;
              const kind = rng.pick(ALL_KINDS);
              const def = getAircraftDef(kind);

              // Spawn point on the perimeter circle around the field center.
              const angle = rng.range(0, Math.PI * 2);
              const r = map.spawnRadius;
              const x = map.center.x + Math.cos(angle) * r;
              const y = map.center.y + Math.sin(angle) * r;

              // Face roughly toward the field center with a little scatter.
              const toCenter = Math.atan2(map.center.y - y, map.center.x - x);
              const heading = toCenter + rng.range(-0.25, 0.25);

              const passengers = Math.round(
                rng.range(def.passengers[0], def.passengers[1])
              );

              // Deterministic landing assignment via the seeded rng (data-only; nothing
              // reads it yet — later strip/render/landing features consume it).
              const assignment = assignLandingTarget(def, map, rng);

              const id = world.createEntity();
              world.addComponent(id, Components.Transform, Transform(x, y, heading));
              world.addComponent(id, Components.Velocity, Velocity(def.speed));
              world.addComponent(
                id,
                Components.Aircraft,
                Aircraft(kind, { passengers, state: "inbound", assignment })
              );
              // Start with no drawn route; the plane drifts straight inbound.
              world.addComponent(id, Components.Path, Path([]));
              world.addComponent(id, Components.Hitbox, Hitbox(def.hitboxRadius));
              world.addComponent(
                id,
                Components.Render,
                // FEAT-004: shrink the drawn icon ~31% (1.3 -> 0.9 multiplier) for phone
                // readability without touching hitboxRadius/separationRadius, so collision
                // and separation stay exactly as balanced in FEAT-003. Class size ordering
                // is preserved (it still scales with each class's hitboxRadius).
                Render({ shape: kind, color: def.color, size: def.hitboxRadius * 0.9 })
              );
              world.addComponent(id, Components.Fuel, Fuel(def.fuelMax));
              world.addComponent(id, Components.Label, Label(makeCallsign(kind)));

              // Track spawn time so landing can report time-in-airspace.
              const ac = world.getComponent(id, Components.Aircraft);
              ac.spawnTime = game.time;

              bus.emit("aircraft:spawn", { id, kind, passengers });
              return id;
            }

            const system = function spawnSystem(dt) {
              if (game.gameOver) return;
              timer += dt;
              // Map-specific spawn scaling (Map 4 Mega Hub is busier => shorter interval).
              const scale = (game.map && game.map.rules && game.map.rules.spawnScale) || 1;
              const interval = spawnInterval(game.time) * scale;
              if (timer >= interval) {
                timer -= interval;
                spawnOne();
              }
            };

            // Expose the one-shot spawner for tests / initial seeding.
            system.spawnOne = spawnOne;
            return system;
          }


          exports.spawnInterval = spawnInterval;
          exports.createSpawnSystem = createSpawnSystem;
        },
        "src/ecs/systems/weatherSystem.js": function (exports, require) {
          // Weather system. Each tick it advances the WeatherController (storm drift,
          // wind-shift schedule, fog schedule), then applies the resulting weather to the
          // simulation:
          //   - storms: any aircraft whose position sits inside a cell, or whose locked
          //     route crosses a cell, loses navigation (its path is cleared) and, if it is
          //     actually inside the cell, is destroyed. A destroyed plane penalizes
          //     reputation like a fuel-out and emits 'aircraft:stormloss'.
          //   - wind: the current wind state is exposed on game.weather for landingSystem
          //     to validate approach directions against.
          //   - fog: drifting fog region(s) are exposed on game.weather.fog for the render
          //     layer, which conceals only planes inside a bank (display-only).

          const { Components } = require("src/ecs/components.js");
          const { createWeatherController, pointInAnyStorm, pathCrossesStorm } = require("src/game/weather.js");

          /** Build the ECS weather system bound to a game instance. */
          function createWeatherSystem(game) {
            const { world, bus, rng } = game;
            const map = game.map;

            const controller = createWeatherController({ rng, map, config: game.weatherConfig });

            // Publish the live weather state on the game so other systems (landing,
            // render) can read it without importing the controller.
            game.weather = {
              controller,
              windDirection: controller.state.windDirection,
              windTolerance: controller.state.windTolerance,
              // Wind-shift transition window (FEAT-003). During an active transition BOTH

              // fields without importing the controller. windPrevDirection mirrors
              // transition.fromDirection for convenience.
              windPrevDirection: controller.state.windPrevDirection,
              windTransition: {
                active: controller.state.windTransition.active,
                fromDirection: controller.state.windTransition.fromDirection,
                toDirection: controller.state.windTransition.toDirection,
                remaining: controller.state.windTransition.remaining,
              },
              storms: controller.state.storms,
              // Moving fog region(s). `banks` is the list of drifting rounded-rect banks
              // that conceal the part of the scope they cover; `active` is true while any
              // bank exists. Render/HUD read these; concealment is display-only.
              fog: { banks: controller.state.fogBanks, active: controller.state.fogBanks.length > 0 },
              ilsOwned: game.ilsOwned ?? false, // FEAT-005 will flip this on purchase
            };

            const system = function weatherSystem(dt) {
              if (game.gameOver) return;

              const events = controller.update(dt);

              // Refresh the published snapshot.
              game.weather.windDirection = controller.state.windDirection;
              game.weather.windPrevDirection = controller.state.windPrevDirection;
              game.weather.windTransition = {
                active: controller.state.windTransition.active,
                fromDirection: controller.state.windTransition.fromDirection,
                toDirection: controller.state.windTransition.toDirection,
                remaining: controller.state.windTransition.remaining,
              };
              game.weather.storms = controller.state.storms;
              game.weather.fog = {
                banks: controller.state.fogBanks,
                active: controller.state.fogBanks.length > 0,
              };
              // The ILS flag is owned by FEAT-005; read it fresh each tick (default false).
              game.weather.ilsOwned = game.ilsOwned ?? false;

              // Announce changes via banners / events.
              for (const ev of events) {
                if (ev.type === "wind") {
                  game.flashBanner && game.flashBanner("WIND SHIFT - BOTH ENDS OPEN BRIEFLY");
                  bus.emit("weather:wind", { windDirection: ev.windDirection });
                } else if (ev.type === "windTransitionEnd") {
                  bus.emit("weather:windtransitionend", { windDirection: ev.windDirection });
                } else if (ev.type === "storm") {
                  game.flashBanner && game.flashBanner("THUNDERSTORM - ROUTE AROUND CELLS");
                  bus.emit("weather:storm", { cell: ev.cell });
                } else if (ev.type === "fog") {
                  if (ev.on) {
                    game.flashBanner && game.flashBanner("FOG BANK - RADAR BLOCKED IN AREA");

                  } else {

                  }
                }
              }

            function applyStorms(storms) {
              if (!storms || storms.length === 0) return;

              for (const id of ids) {
                const t = world.getComponent(id, Components.Aircraft)
                  ? world.getComponent(id, Components.Transform)
                  : null;

                const ac = world.getComponent(id, Components.Aircraft);
                if (ac.state === "landing") continue; // committed; leave the rollout alone

                // Direct hit: inside a cell -> destroyed.
                const hit = pointInAnyStorm(storms, t.x, t.y);

                // must re-route around the weather.

                    : path.points;

                      break;

                  }

                    path.progress = 0;

        "src/ecs/systems/emergencySystem.js": function (exports, require) {
          // Emergency system. Wires the emergency decision logic (game/emergencies.js)
          // into the live simulation:
          //   - On spawn, it rolls to flag a plane as a MAYDAY (engine failure) or, for
          //     helicopters, a MEDICAL evac, stamping the Aircraft.emergency state.
          //   - Each tick it tracks medical-evac helicopters overflying the hospital POI
          //     (setting emergency.hospitalVisited so landing can be accepted), promotes
          //     low-fuel held planes to a FUEL emergency (visible gauge flag), and marks
          //     mayday planes for the red-flash / faster movement already read elsewhere.
          //   - On a successful landing of an emergency aircraft it awards a reputation
          //     bonus; storm losses / fuel-outs penalize reputation (handled by the
          //     console's existing fuelout penalty plus a stormloss penalty added here).

          const { Components } = require("src/ecs/components.js");
          const { AircraftKind, getAircraftDef } = require("src/game/aircraft.js");
          const { isOverHospital, runwayThreshold, runwayFarEnd, normalizeAngle } = require("src/game/airport.js");
          const { rebuildPath } = require("src/ecs/systems/movementSystem.js");
          const { createEmergencyController, EmergencyType, isFuelEmergency, isMaydayPriority, markFuelEmergency, nearestAdequateRunway, straightLineApproach } = require("src/game/emergencies.js");

          /** Build the ECS emergency system bound to a game instance. */
          function createEmergencySystem(game) {
            const { world, bus, rng } = game;

            const controller = createEmergencyController({ rng, config: game.emergencyConfig });

            // Classify fresh spawns into emergencies. Listening to the spawn event keeps
            // the spawn system itself free of emergency concerns.
            const unsub = [];
            unsub.push(
              bus.on("aircraft:spawn", ({ id }) => {
                const ac = world.getComponent(id, Components.Aircraft);
                if (!ac || ac.emergency) return;
                const isHeli = ac.kind === AircraftKind.HELICOPTER;
                const em = controller.classifySpawn(ac, isHeli);
                if (em) {
                  if (em.type === EmergencyType.MAYDAY) {
                    game.flashBanner && game.flashBanner("MAYDAY - ENGINE FAILURE, PRIORITY");
                    bus.emit("emergency:mayday", { id, kind: ac.kind });
                    // Immediate straight-line priority clearance to the nearest adequate
                    // runway, and divert all other inbound traffic out of the way.
                    assignMaydayPriority(id);
                  } else if (em.type === EmergencyType.MEDICAL) {
                    game.flashBanner && game.flashBanner("MEDEVAC - ROUTE VIA HOSPITAL");
                    bus.emit("emergency:medical", { id, kind: ac.kind });
                  }
                }
              })
            );

            // Award a bonus when an emergency aircraft lands safely; penalize storm loss.
            unsub.push(
              bus.on("aircraft:landed", (p) => {
                // The entity is already destroyed by the landing system; the payload does
                // not carry the emergency flag, so we tag it on the clearance path. We
                // instead award based on a flag recorded at commit time (see below).
                if (p && p._emergency && game.reputation) {
                  game.reputation.recover(controller.config.bonusReputation);
                  game.flashBanner && game.flashBanner("EMERGENCY HANDLED +REP");
                  bus.emit("emergency:resolved", { kind: p.kind });
                }
              })
            );

            unsub.push(
              bus.on("aircraft:stormloss", (p) => {
                if (game.reputation) game.reputation.penalize("stormLoss");
                game.flashBanner && game.flashBanner("LOST IN STORM - REP PENALTY");
                checkFired();
              })
            );

            /**
             * Give a mayday aircraft an immediate straight-line priority clearance to the
             * nearest adequate runway and divert every OTHER inbound plane: any other
             * plane currently cleared/locked toward a surface has its clearance released
             * so it reverts to holding and must be re-routed, keeping the approach free
             * for the emergency. Returns the clearance applied (or null if none possible).
             */
            function assignMaydayPriority(maydayId) {
              const ac = world.getComponent(maydayId, Components.Aircraft);
              const t = world.getComponent(maydayId, Components.Transform);
              const path = world.getComponent(maydayId, Components.Path);
              if (!ac || !t || !path || !isMaydayPriority(ac.emergency)) return null;
              if (!game.map || !game.map.runways) return null;

              const def = getAircraftDef(ac.kind);
              const runway = nearestAdequateRunway(game.map.runways, { x: t.x, y: t.y }, def);
              if (!runway) return null; // no adequate runway; player must handle manually

              const approach = straightLineApproach({ x: t.x, y: t.y }, runway, {
                threshold: runwayThreshold,
                farEnd: runwayFarEnd,
                normalizeAngle,

              // would, so the landing system commits it with no player action required.
              path.points = approach.points;
              path.holding = false;
              path.completed = false;
              path.progress = 0;
              path.built = null;
              path._dirty = true;
              path.locked = true;
              ac.clearance = approach.clearance;
              rebuildPath(path, def);

              // Divert all other inbound traffic: release their clearances so they hold.
              const others = world.query(Components.Transform, Components.Aircraft, Components.Path);
              for (const otherId of others) {
                if (otherId === maydayId) continue;
                const oac = world.getComponent(otherId, Components.Aircraft);
                const opath = world.getComponent(otherId, Components.Path);
                if (!oac || !opath) continue;
                if (oac.state === "landing") continue; // already committed to the runway
                if (opath.locked || oac.clearance) {
                  opath.locked = false;
                  opath.completed = false;
                  oac.clearance = null;
                }
              }

              bus.emit("emergency:priority-cleared", { id: maydayId, runwayId: runway.id });
              game.flashBanner && game.flashBanner("PRIORITY: ALL TRAFFIC DIVERTED");

                const t = world.getComponent(id, Components.Transform);

                  if (!ac.emergency.hospitalVisited && hospital && isOverHospital(hospital, t.x, t.y)) {
                    ac.emergency.hospitalVisited = true;
                    void hospital;
                    bus.emit("emergency:hospitalreached", { id, kind: ac.kind });
                    game.flashBanner && game.flashBanner("HOSPITAL REACHED - CLEARED TO LAND");
                  }
                }

                // Fuel emergency: a held/low-fuel plane that is not already flagged.

                  if (!ac.emergency) {

        },
        "src/ecs/systems/movementSystem.js": function (exports, require) {
          // Movement system. Advances each aircraft along its Path (a Catmull-Rom spline)
          // at its class speed, using arc-length parameterization so speed stays constant
          // regardless of control-point spacing. Planes with no path fly straight on their
          // current heading. The system also (re)builds a path's arc-length polyline when
          // its control points change, validating/clamping turns against the class limit
          // so SUPERSONIC jets cannot be given impossibly sharp routes.

          const { Components } = require("src/ecs/components.js");
          const { getAircraftDef } = require("src/game/aircraft.js");
          const { buildPath, clampTurns, sampleAlong } = require("src/game/pathUtils.js");
          const { drainFuel } = require("src/game/fuel.js");
          const { updateMovingRunways, holdingPatternPoints } = require("src/game/maps.js");
          const { maydaySpeedFactor } = require("src/game/emergencies.js");

          // A plane without a cleared route for this many seconds counts as "held too
          // long" and costs reputation once (per hold episode).
          const EXCESSIVE_HOLD_TIME = 30;

          /**
           * Ensure a Path component has an up-to-date built polyline. Turns are clamped to
           * the class max so the followed route is always flyable. Returns the built path.
           * Exposed for input.js to validate a freshly drawn path.
           */
          function rebuildPath(path, aircraftDef) {
            const safePoints = clampTurns(path.points, aircraftDef.maxTurnAngle);
            const built = buildPath(safePoints);
            path.built = built;
            path.points = safePoints;
            path._dirty = false;
